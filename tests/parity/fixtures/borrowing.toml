[[scenario]]
id = "close_env_opt_in"
family = "Borrowing"
rules = ["R-17"]
operation = "run"
close_env = true
expect = { episodes = 1, steps = 2, env_closes = 1, model_closes = 0, reusable = true }

[[scenario]]
id = "binding_releases_borrows"
family = "Borrowing"
rules = ["R-17"]
operation = "borrow"
expect = { env_closes = 0, model_closes = 0, reusable = true, episode_ends = 1 }

[[scenario]]
id = "busy_remote_handle"
family = "Borrowing"
rules = ["R-17"]
operation = "busy_remote"
languages = ["rust", "c", "cpp"]
why = "Python runs no RemoteEnv handle: an open one holds its env's lease. The native languages refuse it with the same upgrade error."
expect = { error = "TypeError", text = "run(RemoteEnv(address)) is gone in rlmesh 0.2: an open RemoteEnv holds its env's lease, so close it and pass the address: run(address)", reusable = true }

[[scenario]]
id = "binding_drop_closes"
family = "Borrowing"
rules = ["R-17"]
operation = "drop_binding"
languages = ["rust"]
why = "A Rust Binding closes on Drop; the other languages close or free it explicitly."
expect = { env_closes = 1, episode_ends = 1 }

[[scenario]]
id = "second_binding_busy_env"
family = "Borrowing"
rules = ["R-17"]
operation = "busy_binding"
languages = ["rust", "c", "cpp"]
why = "Python's runner binds only local envs; a served env's lease refuses a second binding in every language."
expect = { error = "ConnectionError", text = "the env is held by another driver (a binding, a run or a RemoteEnv): close that one first", reusable = true }
