[[scenario]]
id = "api_key_invalid_header"
family = "Remote auth"
rules = ["R-22"]
operation = "remote_auth"
variant = "invalid_header"
expect = { error = "ValueError", text = "the api_key cannot be sent in the authorization header: it contains a control character" }

[[scenario]]
id = "api_key_rejected"
family = "Remote auth"
rules = ["R-22"]
operation = "remote_auth"
variant = "api_key_rejected"
expect = { error = "ConnectionError", text = "could not connect to a model at 'unix://SOCKET'; is the model being served? (Unauthenticated: invalid route token)" }

[[scenario]]
id = "api_key_accepted"
family = "Remote auth"
rules = ["R-22"]
operation = "remote_auth"
variant = "api_key_accepted"
expect = { episodes = 1, steps = 2, env_closes = 0 }

[[scenario]]
id = "https_to_plaintext"
family = "Remote auth"
rules = ["R-22"]
operation = "remote_auth"
variant = "https_to_plaintext"
expect = { error = "ConnectionError", text = "could not connect to a model at 'https://127.0.0.1:PORT'; is the model being served? (TLS handshake with 127.0.0.1:PORT failed: received corrupt message of type InvalidContentType)" }

[[scenario]]
id = "served_model_local_env"
family = "Remote auth"
rules = ["R-17"]
operation = "remote_auth"
variant = "local_env"
expect = { episodes = 1, steps = 2, env_closes = 0 }
