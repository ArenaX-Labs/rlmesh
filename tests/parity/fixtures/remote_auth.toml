[[scenario]]
id = "api_key_invalid_header"
family = "Remote auth"
rules = ["R-22"]
operation = "remote_auth"
variant = "invalid_header"
languages = ["rust", "c", "cpp"]
why = "Python 0.2 serves and reaches models on sessions: no RemoteModel, and no api key or TLS on the address (session security, safety step 6)."
expect = { error = "ValueError", text = "the api_key cannot be sent in the authorization header: it contains a control character" }

