# Each failure crosses a real policy call and a binding's step.

[[scenario]]
id = "error_RLMeshException"
family = "Errors"
rules = ["R-12", "R-21", "R-22"]
operation = "error"
variant = "RLMeshException"
expect = { error = "RLMeshException", text = "scripted failure", code = "", recoverable = false, runtime_base = true, os_base = false, value_base = false, rlmesh_base = true, environment_base = false }

