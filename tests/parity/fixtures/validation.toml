
[[scenario]]
id = "validation_horizon_zero"
family = "Errors"
rules = ["R-21", "R-22"]
operation = "validation"
variant = "horizon_zero"
expect = { error = "ValueError", text = "execution_horizon must be >= 1, got 0" }

