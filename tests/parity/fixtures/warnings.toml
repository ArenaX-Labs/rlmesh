[[scenario]]
id = "python_warnings_as_errors"
family = "Warnings"
rules = ["R-23"]
operation = "warning_error"
languages = ["python"]
why = "warnings-as-errors is Python warnings-filter behavior; native warning-handler failures have separate fixtures."
expect = { error = "UserWarning", caller_frame = true }
