
[[scenario]]
id = "warning_deliver"
family = "Warnings"
rules = ["R-23"]
operation = "warning"
variant = "deliver"
expect = { warnings = 1, category = "UserWarning", calling_thread = true }

[[scenario]]
id = "warning_fail"
family = "Warnings"
rules = ["R-23"]
operation = "warning"
variant = "fail"
expect = { warnings = 1, category = "UserWarning", calling_thread = true, error = "TypeError", text = "warning abort" }

