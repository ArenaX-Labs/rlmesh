
[[scenario]]
id = "sync_context_task"
family = "Sync and async"
rules = ["R-16"]
operation = "context"
variant = "task"
languages = ["rust"]
why = "The Rust sync facade must refuse calls inside a Tokio task; other APIs have no Tokio-context guard."
expect = { error = "RuntimeError", text = "Model::run() blocks; call Model::run_async() from async code" }

[[scenario]]
id = "sync_context_block_in_place"
family = "Sync and async"
rules = ["R-16"]
operation = "context"
variant = "block_in_place"
languages = ["rust"]
why = "Rust block_in_place still counts as a Tokio task for the sync-call guard; other APIs have no such context."
expect = { error = "RuntimeError", text = "Model::run() blocks; call Model::run_async() from async code" }

