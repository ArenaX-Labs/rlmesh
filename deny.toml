[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
no-default-features = true
features = ["abi3-py311"]

[advisories]
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2026-0041", reason = "lz4_flex via zenoh-transport 1.10.1; Zenoh compression is never enabled" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "BSL-1.0",
  "Zlib",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
]
exceptions = [
  { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
  { crate = "unicode_names2@1.3.0", allow = ["Unicode-DFS-2016"] },
  # IJG asks only for an acknowledgment, carried in README.md and THIRD_PARTY_NOTICES.md.
  { crate = "jpeg-encoder@0.7.1", allow = ["IJG"] },
  # egui's embedded fonts; their licence texts ship in THIRD_PARTY_NOTICES.md.
  { crate = "epaint_default_fonts@0.37.0", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"

deny = [{ name = "rlmesh-proto", wrappers = ["rlmesh", "rlmesh-cli", "rlmesh-python"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
