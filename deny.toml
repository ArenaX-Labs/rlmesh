[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
no-default-features = true
features = ["abi3-py311"]

[advisories]
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"
ignore = [
  # lz4_flex is pulled unconditionally by zenoh-transport 1.10.1 (the protocol
  # v2 session transport), even with `transport_compression` off, and the
  # session never enables Zenoh compression. Drop this when zenoh updates.
  { id = "RUSTSEC-2026-0041", reason = "lz4_flex via zenoh-transport 1.10.1; Zenoh compression is never enabled" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "BSL-1.0",
  "Zlib",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
]
exceptions = [
  # dirs uses option-ext for cross-platform OS directory lookups.
  { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
  # pyo3-stub-gen pulls Unicode name data through rustpython-parser for stub checks.
  { crate = "unicode_names2@1.3.0", allow = ["Unicode-DFS-2016"] },
  # jpeg-encoder writes the declared `Image.jpeg_quality` round-trip. Its
  # quantization and Huffman tables are the Independent JPEG Group's, so it is
  # "(MIT OR Apache-2.0) AND IJG"; the IJG terms are permissive and ask only for
  # an acknowledgment, which README.md and the wheel's THIRD_PARTY_NOTICES.md
  # carry. The alternative was a 4:4:4-only encoder that cannot match the
  # upstream 4:2:0 anchor.
  { crate = "jpeg-encoder@0.7.1", allow = ["IJG"] },
  # The cockpit (`rlmesh cockpit`, in every wheel but Linux ARM) draws text
  # with egui's embedded fonts: Ubuntu Light (Ubuntu Font Licence 1.0), Hack
  # (MIT, and the Bitstream Vera License the crate's metadata leaves out) and
  # five icons from emoji-icon-font (MIT). Noto Emoji (OFL-1.1) is in the
  # crate but not built: it needs egui's `monochrome_emoji_fonts`, which is
  # off. All allow bundling with the program if their texts go with it; the
  # wheel's THIRD_PARTY_NOTICES.md carries them.
  { crate = "epaint_default_fonts@0.37.0", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path-only dev-dependencies (packaging strips them) are not wildcards.
allow-wildcard-paths = true
highlight = "simplest-path"

# Architecture boundary: only these crates may depend on rlmesh-proto (the
# internal driver data and editions) directly. The facade uses its data types
# and editions; rlmesh-python stamps handshake PeerInfo and reads edition
# defaults; rlmesh-cli reads the build's editions, for `rlmesh version` and
# the edition check of `rlmesh check-image`.
deny = [{ name = "rlmesh-proto", wrappers = ["rlmesh", "rlmesh-cli", "rlmesh-python"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
