[release]
status = "alpha"
package_family = "0.2"

[workflow]
# TODO: 2026.10 is provisional
base_edition = "2026.10"
current_edition = "2026.10-0.2.0-alpha.1"
supported_editions = ["2026.10-0.2.0-alpha.1"]

[workflow.dropped_editions]
"2026.06" = "0.2 replaces the 0.1 gRPC protocol with realtime sessions"

[workflow.editions."2026.06"]
status = "sealed"
spec = "docs/editions/2026.06.md"
sealed_in = "0.1.0"
spec_sha256 = "a3dcf2195f6b35819c91192396e94a445c039278d99e20db81fa2a2fe43664a2"

[workflow.editions."2026.10-0.2.0-alpha.1"]
status = "provisional"
spec = "docs/editions/2026.10.md"

[protocols."rlmesh-realtime-v1"]
proto = "crates/rlmesh-session-core/proto"
baseline = "crates/rlmesh-session-core/baselines/rlmesh-realtime-v1"
status = "provisional"
frozen_in = ""

[api_surface]
stability_policy = "stable-labels"

[api_surface.python]
schema_version = 2
kind = "rlmesh.python-api-surface"
manifest_kind = "rlmesh.python-api-surface-manifest"
package_artifact = "pypi:rlmesh"
metadata = "tools/rlmesh_api_surface/src/rlmesh_api_surface/api_metadata.json"
contract_snapshot = "python/rlmesh/tests/api_surface/snapshots/api_surface.json"

[api_surface.rust]
kind = "rlmesh.rust-api-surface"
manifest_kind = "rlmesh.rust-api-surface-manifest"
package_artifact = "cargo:rlmesh"
package_name = "rlmesh"
crate = "rlmesh"
features = []
skipped_modules = ["prelude"]
access = "early-access"
stability = "Preview"
summary = "Early access. The rlmesh crate is intended to become stable but may still change; a breaking change ships in a minor release with a migration note. Build on the Python package for anything long-lived."

[api_surface.c]
kind = "rlmesh.c-api-surface"
manifest_kind = "rlmesh.c-api-surface-manifest"
package_artifact = "cargo:rlmesh"
package_name = "rlmesh-capi"
header = "crates/rlmesh-capi/include/rlmesh.h"
standard = "c11"
access = "early-access"
stability = "Experimental"
summary = "Early access. The C ABI is experimental and will break before 1.0; RLMESH_ABI_VERSION changes with every break, and find_package(rlmesh N) refuses another generation."

[api_surface.cpp]
kind = "rlmesh.cpp-api-surface"
manifest_kind = "rlmesh.cpp-api-surface-manifest"
package_artifact = "cargo:rlmesh"
package_name = "rlmesh-capi"
header = "crates/rlmesh-capi/include/rlmesh.hpp"
standard = "c++17"
namespace = "rlmesh"
access = "early-access"
stability = "Experimental"
summary = "Early access. The header-only C++17 wrapper over the C ABI is experimental and will break before 1.0, together with the C ABI it wraps."

[[artifact]]
id = "pypi:rlmesh"
ecosystem = "pypi"
name = "rlmesh"
manifest = "python/rlmesh/pyproject.toml"
version = "0.2.0a1"
role = "core"
publish = true

