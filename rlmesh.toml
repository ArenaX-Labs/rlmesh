[release]
status = "stable"
package_family = "0.1"

[workflow]
base_edition = "2026.06"
current_edition = "2026.06"
supported_editions = ["2026.06"]

# Sealed at 0.1.0: the spec document is immutable (enforced by checksum).
# A later semantic change mints a new edition rather than editing this one.
[workflow.editions."2026.06"]
status = "sealed"
spec = "docs/editions/2026.06.md"
sealed_in = "0.1.0"
spec_sha256 = "08f1a8a7d6839920147ca71f3fc3f84791e11845f5c513280605048d747c5918"

[protocol]
# Single generation, equality-only: there is no support window, so no
# minimum_generation. A bump is a deliberate public major break (v2 won't talk
# to v1), gated by plain equality at the handshake.
current_generation = "rlmesh-wire-v1"

[api_surface]
stability_policy = "stable-labels"

[api_surface.python]
schema_version = 2
kind = "rlmesh.python-api-surface"
manifest_kind = "rlmesh.python-api-surface-manifest"
package_artifact = "pypi:rlmesh"
metadata = "tools/rlmesh_api_surface/src/rlmesh_api_surface/api_metadata.json"
contract_snapshot = "python/rlmesh/tests/api_surface/snapshots/api_surface.json"

[[artifact]]
id = "pypi:rlmesh"
ecosystem = "pypi"
name = "rlmesh"
manifest = "python/rlmesh/pyproject.toml"
version = "0.1.0"
role = "core"
publish = true

[[artifact]]
id = "cargo:rlmesh"
ecosystem = "cargo"
name = "rlmesh"
manifest = "crates/rlmesh/Cargo.toml"
version = "0.1.0"
