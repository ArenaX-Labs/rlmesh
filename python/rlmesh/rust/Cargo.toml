[package]
name = "rlmesh-python"
description = "Native extension bridge for the RLMesh Python package"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["pyo3-build-config"]

[lib]
name = "_rlmesh"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
# The stub generator is the only target that needs `stub-gen`.
required-features = ["stub-gen"]

[features]
default = ["cli"]
abi3-py311 = ["pyo3/abi3-py311"]
cli = ["dep:rlmesh-cli"]
stub-gen = ["dep:pyo3-stub-gen"]

[dependencies]
# No `managed`: the package has its own platform client (`rlmesh.managed`);
# the bundled CLI (feature `cli`) brings it in for itself.
rlmesh = { workspace = true, default-features = false, features = ["lockstep", "viewer"] }
rlmesh-adapters = { workspace = true }
rlmesh-cli = { workspace = true, optional = true }
rlmesh-grpc = { workspace = true }
rlmesh-proto = { workspace = true }
rlmesh-session = { workspace = true, features = ["record"] }
rlmesh-spaces = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
# The Docker sandbox (`sandbox`): image hashes, build contexts, container ids.
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

image = { workspace = true, features = ["png", "jpeg"] }
pyo3 = { workspace = true, features = [
  "auto-initialize",
  "extension-module",
  "generate-import-lib",
] }
pyo3-stub-gen = { workspace = true, optional = true }
# Non-optional on purpose: a build-time-only proc-macro whose
# rustpython-parser/unicode_names2 deps are host tools that never link into the
# cdylib. Supplies `gen_stub_*` (under `stub-gen`) and the `remove_gen_stub`
# no-op shim (without it) for the inert `#[gen_stub(...)]` helper attributes.
pyo3-stub-gen-derive = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true, features = ["resolve-config"] }

[lints]
workspace = true
