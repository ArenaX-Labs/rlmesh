[package]
name = "rlmesh-python"
description = "Native extension bridge for the RLMesh Python package"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["pyo3-build-config"]

[lib]
name = "_rlmesh"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["stub-gen"]

[features]
default = ["cli"]
abi3-py311 = ["pyo3/abi3-py311"]
cli = ["dep:rlmesh-cli"]
stub-gen = ["dep:pyo3-stub-gen"]
# Unreleased; never in a release wheel.
fleet = ["rlmesh-cli?/fleet", "rlmesh-session/fleet"]

# The Linux ARM wheel omits the cockpit window.
[target.'cfg(not(all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
rlmesh-cli = { workspace = true, optional = true, features = ["cockpit"] }

[dependencies]
rlmesh = { workspace = true, default-features = false, features = ["viewer"] }
rlmesh-adapters = { workspace = true }
rlmesh-cli = { workspace = true, optional = true }
rlmesh-proto = { workspace = true }
rlmesh-session = { workspace = true, features = ["record"] }
rlmesh-spaces = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

image = { workspace = true, features = ["png", "jpeg"] }
pyo3 = { workspace = true, features = [
  "auto-initialize",
  "extension-module",
  "generate-import-lib",
] }
pyo3-stub-gen = { workspace = true, optional = true }
# Non-optional: a build-time proc-macro that supplies the `remove_gen_stub` no-op shim when `stub-gen` is off.
pyo3-stub-gen-derive = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true, features = ["resolve-config"] }

[lints]
workspace = true
