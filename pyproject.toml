[project]
name = "rlmesh-workspace"
version = "0.2.0a1"
description = "Development workspace for RLMesh"
requires-python = ">=3.10"
authors = [{ name = "ArenaX Labs", email = "research@competesai.com" }]
maintainers = [{ name = "Josh Blayone", email = "josh@arenaxlabs.com" }]
dependencies = ["rlmesh"]

[dependency-groups]
csharp = ["rlmesh[gymnasium,numpy]", "pytest==8.4.2", "pyyaml==6.0.3"]
dev = [
  "basedpyright==1.36.1",
  "ruff==0.14.9",
  "pytest==8.4.2",
  "pillow",
  "opencv-python-headless==5.0.0.93",
  "rlmesh[gymnasium,numpy,torch,jax]",
  "rlmesh-api-surface",
  "rlmesh-system",
  "rlmesh-system-fixtures",
]
mujoco = ["rlmesh[numpy]", "mujoco==3.16.0", "mcap==1.6.0"]

[tool.basedpyright]
include = [
  "examples/python",
  "python/rlmesh/src/rlmesh",
  "python/rlmesh/tests/unit",
  "python/rlmesh/tests/type_contract/fixtures",
  "tools/rlmesh_api_surface/src/rlmesh_api_surface",
]
exclude = ["examples/python/isaacsim", "examples/python/coding_agent", "**/.venv*"]
typeCheckingMode = "basic"
strict = ["python/rlmesh/src/rlmesh"]
defineConstant = { DEBUG = true }
extraPaths = ["python/rlmesh/src"]
venvPath = "."
venv = ".venv"
failOnWarnings = false

reportMissingImports = "error"
reportMissingTypeStubs = false
reportExplicitAny = false
reportImplicitOverride = "none"

pythonVersion = "3.10"
pythonPlatform = "All"
executionEnvironments = [
  { root = "tools", pythonVersion = "3.11" },
  { root = "examples/python/llm_agent", reportMissingImports = "none" },
  { root = "." },
]

[tool.pytest.ini_options]
addopts = "-m 'not perf and not docker'"
markers = [
  "perf: a wall-clock budget (mise run test:python:perf)",
  "docker: runs real containers on this Docker host (mise run test:sandbox:docker)",
]
pythonpath = [
  ".",
  "tools/rlmesh_api_surface/src",
  "tools/rlmesh_system/src",
  "tools/rlmesh_system_fixtures/src",
]

[tool.ruff]
force-exclude = true
include = [
  "python/**/*.py",
  "python/**/*.pyi",
  "python/**/pyproject.toml",
  "examples/**/*.py",
  "tests/**/*.py",
  "tools/**/*.py",
  "csharp/**/*.py",
  "integrations/unity/**/*.py",
]
extend-exclude = ["python/rlmesh/src/rlmesh/_rlmesh.pyi"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "RUF"]
ignore = ["RUF059", "E501", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["D", "F841", "RUF012"]
"python/rlmesh/tests/**" = ["B017", "D"]
"python/rlmesh/tests/type_contract/fixtures/**" = ["D"]
"tests/system/**" = ["B017", "D"]
"tests/parity/**" = ["B017", "D"]
"csharp/tests/**" = ["B017", "D"]
"tools/rlmesh_api_surface/**" = ["D"]
"tools/rlmesh_system/**" = ["B017", "D"]
"tools/rlmesh_system_fixtures/**" = ["B017", "D"]
"python/rlmesh/examples/**" = ["F405", "D"]
"python/rlmesh/src/rlmesh/_cli/**" = ["D"]
"python/rlmesh/src/rlmesh/__main__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
constraint-dependencies = [
  "gymnasium==1.3.0",
  "numpy==2.2.6 ; python_version < '3.11'",
  "numpy==2.4.6 ; python_version >= '3.11'",
  "torch==2.12.0+cpu ; sys_platform != 'darwin'",
  "torch==2.12.0 ; sys_platform == 'darwin'",
]

[tool.uv.sources]
rlmesh = { workspace = true }
rlmesh-api-surface = { workspace = true }
torch = [{ index = "pytorch-cpu" }]
rlmesh-system = { workspace = true }
rlmesh-system-fixtures = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
  "python/*",
  "tools/rlmesh_api_surface",
  "tools/rlmesh_system",
  "tools/rlmesh_system_fixtures",
]
