
experimental = ["setup-scripts"]

[scripts.setup.runtime-dir]
command = "sh scripts/dev/nextest-runtime-dir.sh"

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

# The real-time tests run hosts and 1 kHz tickers against wall-clock deadlines; side by side on every
# core they starve each other into stalls, so only two run at once.
[test-groups]
realtime = { max-threads = 2 }

[[profile.default.overrides]]
filter = '(package(rlmesh-session) & kind(test)) | (package(rlmesh-device) & binary(robot)) | (package(rlmesh-cli) & binary(host_process))'
test-group = 'realtime'
retries = 2

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
setup = 'runtime-dir'
