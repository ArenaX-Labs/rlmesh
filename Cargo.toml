[workspace]
default-members = [
  "crates/rlmesh",
  "crates/rlmesh-adapters",
  "crates/rlmesh-capi",
  "crates/rlmesh-cli",
  "crates/rlmesh-cockpit",
  "crates/rlmesh-proto",
  "crates/rlmesh-session",
  "crates/rlmesh-session-core",
  "crates/rlmesh-spaces",
  "python/rlmesh/rust",
]
members = ["crates/*", "javascript/rlmesh/native", "javascript/rlmesh/wasm", "python/rlmesh/rust"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.3"
authors = ["ArenaX Labs, Inc. <research@competesai.com>", "Josh Blayone <josh@arenaxlabs.com>"]
edition = "2024"
rust-version = "1.99"
homepage = "https://rlmesh.dev"
repository = "https://github.com/ArenaX-Labs/rlmesh"
documentation = "https://docs.rs/rlmesh"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "science", "simulation"]
keywords = ["rl", "evaluation", "runtime", "gymnasium"]
publish = true

[workspace.dependencies]
rlmesh = { version = "=0.2.0-alpha.3", path = "crates/rlmesh" }
rlmesh-adapters = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-adapters" }
rlmesh-cli = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-cli" }
rlmesh-cockpit = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-cockpit" }
rlmesh-proto = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-proto" }
rlmesh-session = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-session", default-features = false }
rlmesh-session-core = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-session-core" }
rlmesh-spaces = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-spaces" }
rlmesh-tether = { version = "=0.2.0-alpha.3", path = "crates/rlmesh-tether" }
rlmesh-wasm = { version = "=0.2.0-alpha.3", path = "javascript/rlmesh/wasm" }

rayon = "1.10"
prost = "0.14"
tonic-prost-build = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
zenoh = { version = "=1.10.1", default-features = false }
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
egui = "0.37"
egui_kittest = "0.37"
mdns-sd = { version = "0.21", default-features = false }
mcap = { version = "0.26", default-features = false, features = ["zstd"] }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
bytes = "1.9"

async-trait = "0.1"
futures = "0.3"
tokio = "1.52"
tokio-util = "0.7"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"

anyhow = "1"
thiserror = "2"
proptest = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

blake3 = "1"
chacha20 = { version = "0.10", features = ["rng"] }
half = "2"
image = { version = "0.25", default-features = false }
indexmap = "2"
libc = "0.2"
# Pinned exactly: the jpeg round-trip is a pixel contract, so an encoder retune is a vector change.
jpeg-encoder = "=0.7.1"
rand = "0.10"

rav1e = { version = "0.8", default-features = false, features = ["threading"] }
re_mp4 = "0.5"
sha2 = "0.11"
socket2 = "0.6"
tempfile = "3"
uuid = "1"
zeroize = "1"

pyo3 = "0.29"
pyo3-build-config = "0.29"
pyo3-stub-gen = { version = "0.23", default-features = false }
pyo3-stub-gen-derive = "0.23"

axum = "0.8"
base64 = "0.22"
clap = "4.6"
dirs = "6"
keyring = "4.1"
security-framework = "3.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
toml = "1.1"

tokio-rustls = { version = "0.26", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tokio-tungstenite = "0.29"
tower-http = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
double_must_use = "allow"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.node]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[profile.device]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.device.package."*"]
overflow-checks = false

[profile.release]
overflow-checks = true
# FFI bodies rely on `catch_unwind`, a no-op under `panic = "abort"`.
panic = "unwind"
