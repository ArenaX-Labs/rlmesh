[default.extend-words]
ND = "ND"
arange = "arange"
fo = "fo"
iterm = "iterm"
mis = "mis"
trak = "trak"
mdia = "mdia"
writeable = "writeable"
termnal = "termnal"
PARM = "PARM"
UE = "UE"
sur = "sur"

[type.cpp]
extend-glob = ["*.h"]
extend-ignore-identifiers-re = ["^[a-z]{2}$"]
# The upstream DLPack v1.0 block is kept verbatim, including its typos.
extend-ignore-re = ["(?s)#ifndef DLPACK_DLPACK_H_.*?#endif  // DLPACK_DLPACK_H_"]

[files]
extend-exclude = ["**/golden/**"]
