name: Setup toolchain
description: Shared mise + Rust cache bootstrap for every workflow job

inputs:
  python:
    description: Also cache uv and sync the Python dev environment
    default: "false"
  rust-components:
    description: Also install rustfmt/clippy for the pinned toolchain
    default: "false"

runs:
  using: composite
  steps:
    - name: Scope mise to repository config
      shell: bash
      run: echo "MISE_IGNORED_CONFIG_PATHS=$HOME/.config/mise/config.toml" >> "$GITHUB_ENV"

    - name: Install mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: 2026.10.2
        install: true
        install_args: --locked
        cache_key: >-
          {{cache_key_prefix}}-{{platform}}-{{version}}-{{install_args_hash}}-${{ hashFiles('mise.lock') }}

        cache: true

    - name: Install Rust components
      if: inputs.rust-components == 'true'
      shell: bash
      run: rustup component add --toolchain "$(mise current rust)" rustfmt clippy

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          . -> target

    - name: Cache uv packages
      if: inputs.python == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.uv-cache
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Sync Python environment
      if: inputs.python == 'true'
      shell: bash
      run: mise run --skip-tools setup:python
