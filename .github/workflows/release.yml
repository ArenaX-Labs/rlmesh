name: Release

on:
  workflow_dispatch:
    inputs:
      rehearse:
        description: "npm: build, pack and smoke-test the npm release instead of releasing; publishes nothing"
        type: choice
        options:
          - none
          - npm
        default: none
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.rehearse == 'npm' && 'rehearse-npm-' || '' }}${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build published artifacts from source, never from the shared compile cache
  # that developer machines also write to.
  RLMESH_SCCACHE: "0"
  RLMESH_RELEASE_BUILD: "1"

jobs:
  wheels-linux:
    name: Linux + Windows wheels
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.rehearse == 'none')
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"

      - name: Build Linux and Windows release wheels
        run: mise run --skip-tools release:python:wheels:linux

      - name: System tests against built wheels
        run: mise run --skip-tools test:system

      - name: Remove system-test venvs before the Rust cache walks target/
        run: mise run --skip-tools test:system:clean

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux
          path: python/rlmesh/dist/*.whl
          if-no-files-found: error

      - name: Package the C/C++ library
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        run: mise run --skip-tools release:cxx:package

      - name: Package the C/C++ library for Windows (MSVC)
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        run: mise run --skip-tools release:cxx:package --target windows

      - name: Build preliminary NuGet and Unity packages
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 10
        run: |
          mise run --skip-tools csharp:pack
          mise run --skip-tools csharp:upm

      - name: Upload the C/C++ package
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capi-linux
          path: |
            target/capi-pkg/*.tar.gz
            target/capi-pkg/*.tar.gz.sha256
          if-no-files-found: error

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv cache prune --ci

  wheels-macos:
    name: macOS wheels
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.rehearse == 'none')
    runs-on: depot-macos-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"

      - name: Build the universal macOS CLI
        timeout-minutes: 40
        run: mise run --skip-tools release:cli:macos

      - name: Sign the universal macOS CLI
        id: macos-cli-sign
        timeout-minutes: 5
        env:
          RLMESH_CODESIGN_IDENTIFIER: dev.rlmesh.cli
          RLMESH_MACOS_NOTARIZE: optional
          RLMESH_ALLOW_UNSIGNED_MACOS: ${{ vars.RLMESH_ALLOW_UNSIGNED_MACOS }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-sign.sh sign target/macos-cli/rlmesh

      - name: Notarize the universal macOS CLI
        if: steps.macos-cli-sign.outputs.notarize == 'true'
        timeout-minutes: 17
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-sign.sh notarize target/macos-cli/rlmesh

      - name: Upload macOS CLI notarization evidence
        if: ${{ !cancelled() && steps.macos-cli-sign.outputs.notarize == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-cli-notarization
          path: target/macos-cli/notarization*.json
          if-no-files-found: warn

      - name: Delete the temporary CLI signing keychain
        if: ${{ always() }}
        timeout-minutes: 2
        run: bash scripts/release-macos-sign.sh cleanup

      - name: Build macOS release wheels
        env:
          RLMESH_MACOS_CLI: ${{ steps.macos-cli-sign.outputs.signed == 'true' && 'target/macos-cli/rlmesh' || '' }}
        run: mise run --skip-tools release:python:wheels:macos

      - name: System tests against built wheels
        run: mise run --skip-tools test:system

      - name: Remove system-test venvs before the Rust cache walks target/
        run: mise run --skip-tools test:system:clean

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos
          path: python/rlmesh/dist/*.whl
          if-no-files-found: error

      - name: Build universal macOS C library
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 40
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build -p rlmesh-capi --release --lib --target aarch64-apple-darwin
          cargo build -p rlmesh-capi --release --lib --target x86_64-apple-darwin
          mkdir -p target/macos-universal
          lipo -create target/aarch64-apple-darwin/release/librlmesh_capi.dylib target/x86_64-apple-darwin/release/librlmesh_capi.dylib -output target/macos-universal/librlmesh_capi.dylib
          lipo -create target/aarch64-apple-darwin/release/librlmesh_capi.a target/x86_64-apple-darwin/release/librlmesh_capi.a -output target/macos-universal/librlmesh_capi.a
          library=target/macos-universal/librlmesh_capi.dylib
          if [[ "$(otool -D "$library" | tail -1)" != '@rpath/librlmesh_capi.dylib' ]]; then
            install_name_tool -id @rpath/librlmesh_capi.dylib "$library"
          fi

      - name: Sign the universal macOS library
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        id: macos-sign
        timeout-minutes: 5
        env:
          RLMESH_ALLOW_UNSIGNED_MACOS: ${{ vars.RLMESH_ALLOW_UNSIGNED_MACOS }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-sign.sh sign

      - name: Notarize the universal macOS library
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 17
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-sign.sh notarize

      - name: Upload macOS notarization evidence
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-notarization
          path: target/macos-universal/notarization*.json
          if-no-files-found: warn

      - name: Delete the temporary signing keychain
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 2
        run: bash scripts/release-macos-sign.sh cleanup

      - name: Package the macOS C/C++ library
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        run: mise run --skip-tools release:cxx:package --target macos

      - name: Smoke test the macOS C/C++ package
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        run: bash scripts/release-macos-smoke.sh

      - name: Upload the macOS C/C++ package
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capi-macos
          path: |
            target/capi-pkg/*.tar.gz
            target/capi-pkg/*.tar.gz.sha256
          if-no-files-found: error

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv cache prune --ci

  esp32:
    name: ESP32 Arduino libraries
    if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install board toolchains
        run: mise run --skip-tools setup:esp32

      - name: Build precompiled libraries and compile examples
        env:
          RLMESH_ESP32_REQUIRE_XTENSA: "1"
        run: mise exec arduino-cli@1.5.1 -- mise run --skip-tools build:esp32

      - name: Upload board libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32-libraries
          path: target/esp32/dist/RLMesh-*.zip
          if-no-files-found: error

      - name: Attach board libraries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/esp32/dist/RLMesh-*.zip --clobber

  publish:
    name: Publish PyPI + crates.io + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.rehearse == 'none')
    runs-on: depot-ubuntu-24.04-4
    needs: [wheels-linux, wheels-macos]
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Download wheel matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: python/rlmesh/dist

      - name: Download the C/C++ package
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capi-*
          merge-multiple: true
          path: target/capi-pkg

      - name: Assemble final NuGet and Unity release packages
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 10
        run: |
          mise run --skip-tools csharp:pack --require-all
          mise run --skip-tools csharp:upm --require-all

      - name: Package crates
        run: mise run --skip-tools release:rust:package

      - name: Validate release artifact licenses
        run: mise run --skip-tools release:artifacts:licenses

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/rlmesh/dist
          skip-existing: true

      - name: Authenticate to crates.io
        id: crates-auth
        if: vars.RLMESH_PUBLISH_CRATES == '1'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates
        if: vars.RLMESH_PUBLISH_CRATES == '1'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: python scripts/release.py "${GITHUB_REF_NAME#v}" --publish-crates

      - name: Note crates.io publishing is off
        if: vars.RLMESH_PUBLISH_CRATES != '1'
        timeout-minutes: 1
        run: echo '::notice::crates.io publishing skipped; set the RLMESH_PUBLISH_CRATES repository variable to 1 to publish the crates.'

      - name: Authenticate to nuget.org with trusted publishing
        id: nuget-login
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 2
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet package and symbols
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          mise -C csharp exec -- dotnet nuget push "$GITHUB_WORKSPACE/target/csharp-pkg/*.nupkg" --no-symbols --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          mise -C csharp exec -- dotnet nuget push "$GITHUB_WORKSPACE/target/csharp-pkg/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Note nuget.org publishing is not configured
        if: ${{ false && startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 1
        run: echo '::notice::nuget.org publishing skipped; configure the trusted publishing policy and NUGET_USER repository variable to enable it.'

      - name: Note npm publishing is off
        if: vars.RLMESH_PUBLISH_NPM != '1'
        timeout-minutes: 1
        run: echo '::notice::npm publishing skipped; set the RLMESH_PUBLISH_NPM repository variable to 1 to build and publish the npm packages.'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py "${GITHUB_REF_NAME#v}" --github-release

  npm-linux:
    name: npm - wasm, bundles, Linux and Windows addons
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.rehearse == 'npm') ||
      (startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.rehearse == 'none') && vars.RLMESH_PUBLISH_NPM == '1')
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        timeout-minutes: 20
        uses: ./.github/actions/setup

      - name: Build the npm package and its Linux and Windows addons
        timeout-minutes: 70
        run: |
          mise run --skip-tools build:js
          for platform in linux-x64 linux-arm64 win32-x64; do
            mise run --skip-tools release:js:native "$platform"
          done

      - name: Upload the npm build
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-linux
          path: |
            javascript/rlmesh/dist/
            target/npm-native/*.node
          if-no-files-found: error
          retention-days: ${{ inputs.rehearse == 'npm' && 1 || 30 }}

  npm-macos:
    name: npm - macOS addons
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.rehearse == 'npm') ||
      (startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.rehearse == 'none') && vars.RLMESH_PUBLISH_NPM == '1')
    runs-on: depot-macos-latest
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        timeout-minutes: 20
        uses: ./.github/actions/setup

      - name: Build the macOS Node addons
        timeout-minutes: 40
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          mise run --skip-tools release:js:native darwin-arm64
          mise run --skip-tools release:js:native darwin-x64

      - name: Upload the macOS Node addons
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-macos
          path: target/npm-native/*.node
          if-no-files-found: error
          retention-days: ${{ inputs.rehearse == 'npm' && 1 || 30 }}

  npm-pack:
    name: npm - pack, check, smoke test on linux-x64
    needs: [npm-linux, npm-macos]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        timeout-minutes: 15
        uses: ./.github/actions/setup

      - name: Download the npm build
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-linux
          path: .

      - name: Download the macOS Node addons
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-macos
          path: target/npm-native

      - name: Pack the npm packages
        timeout-minutes: 5
        run: mise run --skip-tools release:js:package --require-all

      - name: Check the tarballs and smoke test them on linux-x64
        timeout-minutes: 10
        run: mise run --skip-tools release:js:smoke --require-all --max-glibc 2.28

      - name: Upload the npm tarballs
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: target/npm-pkg/*.tgz
          if-no-files-found: error
          retention-days: ${{ inputs.rehearse == 'npm' && 3 || 30 }}

  npm-smoke-macos:
    name: npm - smoke test on darwin-arm64
    needs: npm-pack
    runs-on: depot-macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        timeout-minutes: 15
        uses: ./.github/actions/setup

      - name: Download the npm tarballs
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: target/npm-pkg

      - name: Smoke test the tarballs on darwin-arm64
        timeout-minutes: 10
        run: |
          [ "$(uname -m)" = arm64 ] || { echo "error: expected an arm64 runner, got $(uname -m)" >&2; exit 1; }
          mise run --skip-tools release:js:smoke --require-all

  publish-npm:
    name: Publish npm
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.rehearse == 'none') && vars.RLMESH_PUBLISH_NPM == '1'
    needs: [publish, npm-pack, npm-smoke-macos]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node and npm at mise.lock's versions: trusted publishing needs npm 11.5.1 or newer.
      - name: Setup toolchain
        timeout-minutes: 15
        uses: ./.github/actions/setup

      - name: Download the npm tarballs
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: target/npm-pkg

      - name: Publish to npm
        timeout-minutes: 10
        run: mise run --skip-tools release:js:publish "${GITHUB_REF_NAME#v}"
