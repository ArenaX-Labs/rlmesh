name: Release

# Tags build Linux/Windows/macOS wheels, C/C++ tarballs and NuGet/Unity packages.
# Publish crates.io, PyPI and configured nuget.org via OIDC, plus GitHub assets.
# workflow_dispatch only runs on tags; re-run failed jobs to preserve built bytes.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Build published artifacts from source, never from the shared compile cache
# that developer machines also write to (RUSTC_WRAPPER in mise.toml).
env:
  RLMESH_SCCACHE: "0"
  RLMESH_RELEASE_BUILD: "1"

jobs:
  wheels-linux:
    name: Linux + Windows wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"

      - name: Build Linux and Windows release wheels
        run: mise run --skip-tools release:python:wheels:linux

      - name: System tests against built wheels
        run: mise run --skip-tools test:system

      - name: Remove system-test venvs before the Rust cache walks target/
        run: mise run --skip-tools test:system:clean

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux
          path: python/rlmesh/dist/*.whl
          if-no-files-found: error

      - name: Package the C/C++ library
        run: mise run --skip-tools release:cxx:package

      # Cross-built from Linux, like the Windows wheels: no Windows runner.
      - name: Package the C/C++ library for Windows (MSVC)
        run: mise run --skip-tools release:cxx:package --target windows

      - name: Build preliminary NuGet and Unity packages
        timeout-minutes: 10
        run: |
          mise run --skip-tools csharp:pack
          mise run --skip-tools csharp:upm

      - name: Upload the C/C++ package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capi-linux
          path: |
            target/capi-pkg/*.tar.gz
            target/capi-pkg/*.tar.gz.sha256
          if-no-files-found: error

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  wheels-macos:
    name: macOS wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-macos-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"

      - name: Build macOS release wheels
        run: mise run --skip-tools release:python:wheels:macos

      - name: System tests against built wheels
        run: mise run --skip-tools test:system

      - name: Remove system-test venvs before the Rust cache walks target/
        run: mise run --skip-tools test:system:clean

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos
          path: python/rlmesh/dist/*.whl
          if-no-files-found: error

      - name: Build universal macOS C library
        timeout-minutes: 40
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build -p rlmesh-capi --release --lib --target aarch64-apple-darwin
          cargo build -p rlmesh-capi --release --lib --target x86_64-apple-darwin
          mkdir -p target/macos-universal
          lipo -create target/aarch64-apple-darwin/release/librlmesh_capi.dylib target/x86_64-apple-darwin/release/librlmesh_capi.dylib -output target/macos-universal/librlmesh_capi.dylib
          lipo -create target/aarch64-apple-darwin/release/librlmesh_capi.a target/x86_64-apple-darwin/release/librlmesh_capi.a -output target/macos-universal/librlmesh_capi.a
          library=target/macos-universal/librlmesh_capi.dylib
          if [[ "$(otool -D "$library" | tail -1)" != '@rpath/librlmesh_capi.dylib' ]]; then
            install_name_tool -id @rpath/librlmesh_capi.dylib "$library"
          fi

      - name: Sign the universal macOS library
        id: macos-sign
        timeout-minutes: 5
        env:
          RLMESH_ALLOW_UNSIGNED_MACOS: ${{ vars.RLMESH_ALLOW_UNSIGNED_MACOS }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-sign.sh sign

      - name: Notarize the universal macOS library
        if: steps.macos-sign.outputs.notarize == 'true'
        timeout-minutes: 17
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-sign.sh notarize

      - name: Upload macOS notarization evidence
        if: always() && steps.macos-sign.outputs.notarize == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notarization
          path: target/macos-universal/notarization*.json
          if-no-files-found: warn

      - name: Delete the temporary signing keychain
        if: always()
        timeout-minutes: 2
        run: bash scripts/release-macos-sign.sh cleanup

      - name: Package the macOS C/C++ library
        timeout-minutes: 5
        run: mise run --skip-tools release:cxx:package --target macos

      - name: Smoke test the macOS C/C++ package
        timeout-minutes: 5
        run: bash scripts/release-macos-smoke.sh

      - name: Upload the macOS C/C++ package
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capi-macos
          path: |
            target/capi-pkg/*.tar.gz
            target/capi-pkg/*.tar.gz.sha256
          if-no-files-found: error

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  publish:
    name: Publish crates.io + PyPI + NuGet + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04-4
    needs: [wheels-linux, wheels-macos]
    environment: release
    permissions:
      contents: write # GitHub Release
      id-token: write # OIDC trusted publishing (crates.io + PyPI)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Download wheel matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: python/rlmesh/dist

      - name: Download the C/C++ package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: capi-*
          merge-multiple: true
          path: target/capi-pkg

      # Both builders have completed: require all four RIDs and preserve the
      # signed/notarized macOS bytes from the C tarball.
      - name: Assemble final NuGet and Unity release packages
        timeout-minutes: 10
        run: |
          mise run --skip-tools csharp:pack --require-all
          mise run --skip-tools csharp:upm --require-all

      - name: Package crates
        run: mise run --skip-tools release:rust:package

      - name: Validate release artifact licenses
        run: mise run --skip-tools release:artifacts:licenses

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: python scripts/release.py "${GITHUB_REF_NAME#v}" --publish-crates

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/rlmesh/dist
          skip-existing: true

      - name: Authenticate to nuget.org with trusted publishing
        id: nuget-login
        if: vars.NUGET_USER != ''
        timeout-minutes: 2
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet package and symbols
        if: vars.NUGET_USER != ''
        timeout-minutes: 5
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Keep the temporary key in the environment; do not enable tracing.
          mise -C csharp exec -- dotnet nuget push "$GITHUB_WORKSPACE/target/csharp-pkg/*.nupkg" --no-symbols --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          mise -C csharp exec -- dotnet nuget push "$GITHUB_WORKSPACE/target/csharp-pkg/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Note nuget.org publishing is not configured
        if: vars.NUGET_USER == ''
        timeout-minutes: 1
        run: echo '::notice::nuget.org publishing skipped; configure the trusted publishing policy and NUGET_USER repository variable to enable it.'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py "${GITHUB_REF_NAME#v}" --github-release
