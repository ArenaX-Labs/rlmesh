name: Release

# Tags build Linux/Windows/macOS wheels and publish crates.io and PyPI via OIDC,
# plus the GitHub Release. 0.2 ships Rust and Python only: the C/C++, NuGet and
# Unity packages are not built until those languages ship.
# workflow_dispatch only runs on tags; re-run failed jobs to preserve built bytes.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Build published artifacts from source, never from the shared compile cache
# that developer machines also write to (RUSTC_WRAPPER in mise.toml).
env:
  RLMESH_SCCACHE: "0"
  RLMESH_RELEASE_BUILD: "1"

jobs:
  wheels-linux:
    name: Linux + Windows wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"

      - name: Build Linux and Windows release wheels
        run: mise run --skip-tools release:python:wheels:linux

      - name: System tests against built wheels
        run: mise run --skip-tools test:system

      - name: Remove system-test venvs before the Rust cache walks target/
        run: mise run --skip-tools test:system:clean

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux
          path: python/rlmesh/dist/*.whl
          if-no-files-found: error

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  wheels-macos:
    name: macOS wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-macos-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"

      - name: Build macOS release wheels
        run: mise run --skip-tools release:python:wheels:macos

      - name: System tests against built wheels
        run: mise run --skip-tools test:system

      - name: Remove system-test venvs before the Rust cache walks target/
        run: mise run --skip-tools test:system:clean

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos
          path: python/rlmesh/dist/*.whl
          if-no-files-found: error

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  publish:
    name: Publish crates.io + PyPI + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04-4
    needs: [wheels-linux, wheels-macos]
    environment: release
    permissions:
      contents: write # GitHub Release
      id-token: write # OIDC trusted publishing (crates.io + PyPI)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Download wheel matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: python/rlmesh/dist

      - name: Package crates
        run: mise run --skip-tools release:rust:package

      - name: Validate release artifact licenses
        run: mise run --skip-tools release:artifacts:licenses

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: python scripts/release.py "${GITHUB_REF_NAME#v}" --publish-crates

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/rlmesh/dist
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py "${GITHUB_REF_NAME#v}" --github-release
