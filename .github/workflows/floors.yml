name: Dependency Floors

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  floors:
    name: Floor-matrix tests
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scope mise to repository config
        run: echo "MISE_IGNORED_CONFIG_PATHS=$HOME/.config/mise/config.toml" >> "$GITHUB_ENV"

      - name: Install mise
        uses: jdx/mise-action@v4.1.0
        with:
          version: 2026.6.12
          install: true
          install_args: --locked
          cache_key: >-
            {{cache_key_prefix}}-{{platform}}-{{version}}-{{install_args_hash}}-${{ hashFiles('mise.lock') }}

          cache: true

      - name: Install Rust components
        run: rustup component add --toolchain 1.96.0 rustfmt clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Cache uv packages
        uses: actions/cache@v5
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync Python environment
        run: mise run --skip-tools setup:python

      - name: Floor-matrix tests
        run: mise run --skip-tools test:python:floors

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
