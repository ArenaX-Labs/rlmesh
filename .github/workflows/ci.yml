name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"
          rust-components: "true"

      - name: Static checks
        run: mise run --skip-tools check

      # Same entrypoint as local `mise run test:ci`: Rust, Python, C/C++ (zig),
      # API surface, examples, system harness, and the installed-wheel system
      # profile against a wheel built from this checkout.
      - name: Tests
        run: mise run --skip-tools test:ci

      # `test` runs the C/C++ bindings under zig (libc++); re-run under clang and gcc.
      - name: C/C++ bindings under clang and gcc
        run: |
          CC=clang CXX=clang++ mise run --skip-tools test:cxx
          CC=gcc CXX=g++ mise run --skip-tools test:cxx

      - name: Docs build
        run: mise run --skip-tools docs:build

      - name: Remove system-test venvs before the Rust cache walks target/
        if: always()
        run: mise run --skip-tools test:system:clean

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  cross-version:
    name: Cross-Version Matrix
    runs-on: depot-ubuntu-24.04-4
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"
          rust-components: "true"

      # Builds a release-cohort wheel and runs it against the published wheel
      # pinned in tests/system/crossver.lock. Its own job, not part of `test`:
      # a break here is a break in the compatibility promise, not a nightly.
      - name: Cross-version matrix
        run: mise run --skip-tools test:crossver

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  package:
    name: Rust Package Verification
    runs-on: depot-ubuntu-24.04-4
    needs: fast
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          rust-components: "true"

      - name: Rust package verification
        run: mise run --skip-tools release:rust:package

      - name: C/C++ package verification (pkg-config + CMake find_package)
        env:
          CC: clang
          CXX: clang++
        run: mise run --skip-tools test:cxx:pkg
