name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"
          rust-components: "true"

      - name: Static checks
        run: mise run --skip-tools check

      - name: Unit, integration, and conformance tests
        run: mise run --skip-tools test

      - name: Python API surface tests
        run: mise run --skip-tools test:python:api-surface

      - name: Python example programs
        run: mise run --skip-tools test:python:examples

      - name: System harness tests
        run: mise run --skip-tools test:system:harness

      - name: Docs build
        run: mise run --skip-tools docs:build

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  package:
    name: Rust Package Verification
    runs-on: depot-ubuntu-24.04-4
    needs: fast
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          rust-components: "true"

      - name: Rust package verification
        run: mise run --skip-tools release:rust:package
