name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      RLMESH_RELEASE_BUILD: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"
          rust-components: "true"

      - name: Select C# and Windows checks from affected crates and files
        id: affected
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          python scripts/dev/affected.py --base "$base" --ci --dry-run --github-output "$GITHUB_OUTPUT"

      - name: Static checks
        run: mise run --skip-tools check

      - name: Restore the MSVC CRT and SDK for the Windows check
        if: steps.affected.outputs.windows == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin/xwin
          key: xwin-${{ runner.os }}-v1

      - name: Windows wheel and Node addon compile (x86_64-pc-windows-msvc)
        if: steps.affected.outputs.windows == 'true'
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-check
        run: |
          mise run --skip-tools check:windows
          rm -rf "$CARGO_TARGET_DIR"

      - name: Tests
        run: mise run --skip-tools test:ci

      - name: Disk left after the test builds
        if: always()
        run: |
          df -h / /tmp
          du -sh target/* 2>/dev/null | sort -rh | head -12

      - name: Install C# toolchain when affected
        if: steps.affected.outputs.csharp == 'true'
        run: |
          mise trust csharp/mise.toml
          mkdir -p "$HOME/.cache/rlmesh-csharp/tmp"
          TMPDIR="$HOME/.cache/rlmesh-csharp/tmp" mise -C csharp install --locked dotnet zig

      - name: C# interop, ownership and Python interoperability
        timeout-minutes: 10
        if: steps.affected.outputs.csharp == 'true'
        run: mise run --skip-tools test:csharp

      - name: C# NativeAOT serving supplement
        if: steps.affected.outputs.csharp == 'true'
        timeout-minutes: 5
        run: mise run --skip-tools test:csharp:aot

      - name: C# NuGet restore and Unity package structure
        if: steps.affected.outputs.csharp == 'true'
        timeout-minutes: 5
        run: mise run --skip-tools test:csharp:package

      - name: Rust package verification
        if: github.event_name != 'pull_request'
        run: mise run --skip-tools release:rust:package

      - name: C/C++ package verification (pkg-config + CMake find_package)
        env:
          CC: clang
          CXX: clang++
        run: mise run --skip-tools test:cxx:pkg

      - name: C/C++ bindings under clang
        if: github.event_name != 'pull_request'
        run: CC=clang CXX=clang++ mise run --skip-tools test:cxx

      - name: Compile cache stats
        if: always()
        run: sccache --show-stats

      - name: Remove system-test venvs before the Rust cache walks target/
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: mise run --skip-tools test:system:clean

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv cache prune --ci

  browser:
    name: Browser (wasm + JS)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip unless browser, sans-IO or tether inputs changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then printf 'run=true\nsansio=true\ntether=true\nesp32=true\nnative=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          paths='^(crates/rlmesh-session(-core)?/|javascript/|examples/web/|scripts/check-wasm\.mjs$|Cargo\.(toml|lock)$|mise\.(toml|lock)$|clippy\.toml$|\.mise/tasks/(setup/js|build/js|check/sans-io|test/js/)|\.github/(workflows/ci\.yml|actions/setup/))'
          changed="$(git diff --name-only "$base"...HEAD)"
          if grep -qE "$paths" <<<"$changed"; then run=true; else run=false; fi
          if [ "$run" = true ] || grep -qE '^crates/rlmesh-tether/' <<<"$changed"; then sansio=true; else sansio=false; fi
          if grep -qE '^(crates/rlmesh-tether/|integrations/arduino/|\.mise/tasks/test/tether/|mise\.(toml|lock)$|\.github/(workflows/ci\.yml|actions/setup/))' <<<"$changed"; then tether=true; else tether=false; fi
          if grep -qE '^(crates/rlmesh-(device|session|session-core|tether)/|integrations/esp32/|Cargo\.(toml|lock)$|mise\.(toml|lock)$|\.mise/tasks/(build/(esp32|zenoh-pico)|setup/esp32|test/esp32/)|\.github/(workflows/ci\.yml|actions/setup/))' <<<"$changed"; then esp32=true; else esp32=false; fi
          printf 'esp32=%s\n' "$esp32" >> "$GITHUB_OUTPUT"
          if grep -qE '^(javascript/rlmesh/(native/|src/(native|node|fleet)\.ts$|test/native/|build\.mjs$)|examples/node/|crates/rlmesh(-session(-core)?|-spaces|-adapters|-proto)?/|Cargo\.(toml|lock)$|mise\.(toml|lock)$|\.github/(workflows/ci\.yml|actions/setup/))' <<<"$changed"; then native=true; else native=false; fi
          printf 'native=%s\n' "$native" >> "$GITHUB_OUTPUT"
          printf 'run=%s\nsansio=%s\ntether=%s\n' "$run" "$sansio" "$tether" | tee -a "$GITHUB_OUTPUT"

      - name: Setup toolchain
        if: steps.changes.outputs.sansio == 'true' || steps.changes.outputs.tether == 'true' || steps.changes.outputs.esp32 == 'true' || steps.changes.outputs.native == 'true'
        uses: ./.github/actions/setup
        with:
          rust-components: "true"
          python: ${{ steps.changes.outputs.native }}

      - name: Browser toolchain
        if: steps.changes.outputs.sansio == 'true'
        run: mise run --skip-tools setup:js

      - name: Sans-IO guard
        if: steps.changes.outputs.sansio == 'true'
        run: mise run --skip-tools check:sans-io

      - name: Install board toolchains when affected
        if: steps.changes.outputs.esp32 == 'true'
        run: mise run --skip-tools setup:esp32

      - name: Build ESP32, ESP32-S3 and ESP32-C6 libraries and examples
        if: steps.changes.outputs.esp32 == 'true'
        env:
          RLMESH_ESP32_REQUIRE_XTENSA: "1"
        run: ARDUINO_CLI="$(mise exec arduino-cli@1.5.1 -- which arduino-cli)" mise run --skip-tools build:esp32

      - name: Board transport command path on loopback
        if: steps.changes.outputs.esp32 == 'true'
        run: mise run --skip-tools test:esp32:host

      - name: Arduino tether codec against the vectors
        if: steps.changes.outputs.tether == 'true'
        env:
          CXX: g++
        run: mise run --skip-tools test:tether:cpp

      - name: rlmesh-wasm tests under Node
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools test:js:wasm

      - name: Build the wasm and javascript/rlmesh
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools build:js

      - name: wasm import check and size budget
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools check:js:wasm

      - name: TypeScript strict typecheck
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools typecheck:js

      - name: JS unit tests
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools test:js:unit

      - name: Node native addon tests
        if: steps.changes.outputs.native == 'true'
        timeout-minutes: 20
        run: mise run --skip-tools test:js:native

      - name: Minimize uv cache
        if: ${{ !cancelled() && steps.changes.outputs.native == 'true' }}
        timeout-minutes: 5
        run: uv cache prune --ci
