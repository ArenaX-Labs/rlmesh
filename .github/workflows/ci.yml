name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      # One release-cohort wheel build serves basic and compatibility profiles.
      RLMESH_RELEASE_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"
          rust-components: "true"

      # Setup installs the committed tool lock with --locked. Do not refresh
      # remote dependency metadata during verification.
      - name: Static checks
        run: mise run --skip-tools check

      # Same entrypoint as local `mise run test:ci`: Rust, Python, C/C++ (zig),
      # API surface, examples, system harness, and the installed-wheel system
      # profile against a wheel built from this checkout.
      - name: Tests
        run: mise run --skip-tools test:ci

      - name: Cross-version matrix against the already-built wheels
        run: mise run --skip-tools test:crossver:installed

      # Verify the distributable source, not just the workspace checkout.
      # Keep this in the required job so package failures cannot pass the gate.
      - name: Rust package verification
        run: mise run --skip-tools release:rust:package

      - name: C/C++ package verification (pkg-config + CMake find_package)
        env:
          CC: clang
          CXX: clang++
        run: mise run --skip-tools test:cxx:pkg

      # `test` runs the C/C++ bindings under zig (libc++); re-run under clang and gcc.
      - name: C/C++ bindings under clang and gcc
        run: |
          CC=clang CXX=clang++ mise run --skip-tools test:cxx
          CC=gcc CXX=g++ mise run --skip-tools test:cxx

      - name: Remove system-test venvs before the Rust cache walks target/
        if: always()
        run: mise run --skip-tools test:system:clean

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
