name: CI

on:
  workflow_dispatch:
  # Draft PRs skip CI; marking one ready runs it once.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04-8
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      # One release-cohort wheel build serves the installed-artifact profiles.
      RLMESH_RELEASE_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          python: "true"
          rust-components: "true"

      - name: Select C# checks from affected crates and files
        id: csharp_changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          python scripts/dev/affected.py --base "$base" --ci --dry-run --github-output "$GITHUB_OUTPUT"

      # Setup installs the committed tool lock with --locked. Do not refresh
      # remote dependency metadata during verification.
      - name: Static checks
        run: mise run --skip-tools check

      # Same entrypoint as local `mise run test:ci`: Rust, Python, C/C++ (zig),
      # API surface, examples, system harness, and the installed-wheel system
      # profile against a wheel built from this checkout.
      - name: Tests
        run: mise run --skip-tools test:ci

      - name: Install C# toolchain when affected
        if: steps.csharp_changes.outputs.csharp == 'true'
        run: |
          mise trust csharp/mise.toml
          mkdir -p "$HOME/.cache/rlmesh-csharp/tmp"
          TMPDIR="$HOME/.cache/rlmesh-csharp/tmp" mise -C csharp install --locked dotnet zig

      - name: C# interop, ownership and Python interoperability
        timeout-minutes: 10
        if: steps.csharp_changes.outputs.csharp == 'true'
        run: mise run --skip-tools test:csharp

      - name: C# NativeAOT serving supplement
        if: steps.csharp_changes.outputs.csharp == 'true'
        timeout-minutes: 5
        run: mise run --skip-tools test:csharp:aot

      - name: C# NuGet restore and Unity package structure
        if: steps.csharp_changes.outputs.csharp == 'true'
        timeout-minutes: 5
        run: mise run --skip-tools test:csharp:package

      # Verify the distributable source, not just the workspace checkout.
      # Keep this in the required job so package failures cannot pass the gate.
      - name: Rust package verification
        run: mise run --skip-tools release:rust:package

      - name: C/C++ package verification (pkg-config + CMake find_package)
        env:
          CC: clang
          CXX: clang++
        run: mise run --skip-tools test:cxx:pkg

      # `test` runs the C/C++ bindings under zig (clang, libc++). Pull requests re-run
      # them under gcc (libstdc++), the most different toolchain; pushes to main and
      # manual runs add real clang too.
      - name: C/C++ bindings under gcc
        run: CC=gcc CXX=g++ mise run --skip-tools test:cxx

      - name: C/C++ bindings under clang
        if: github.event_name != 'pull_request'
        run: CC=clang CXX=clang++ mise run --skip-tools test:cxx

      # RUSTC_WRAPPER=sccache comes from mise.toml; Depot runners point it at Depot Cache.
      - name: Compile cache stats
        if: always()
        run: sccache --show-stats

      - name: Remove system-test venvs before the Rust cache walks target/
        if: always()
        run: mise run --skip-tools test:system:clean

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  # The browser binding (javascript/rlmesh, its wasm core in javascript/rlmesh/wasm). No trigger or
  # matrix of its own: it rides this workflow's triggers and concurrency
  # group, on the smallest Depot runner. The first step diffs against the
  # base (as the C# selection above does); every later step is skipped unless
  # a browser input changed, so an unaffected run costs a checkout and a
  # `git diff`. The tools come from javascript/mise.toml (`setup:js`), so no
  # other job installs them.
  browser:
    name: Browser (wasm + JS)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip unless browser inputs changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          paths='^(crates/rlmesh-session(-core)?/|javascript/|examples/web/|scripts/check-wasm\.mjs$|Cargo\.(toml|lock)$|mise\.(toml|lock)$|clippy\.toml$|\.mise/tasks/(setup/js|build/js|check/sans-io|test/js/)|\.github/(workflows/ci\.yml|actions/setup/))'
          if git diff --name-only "$base"...HEAD | grep -qE "$paths"; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - name: Setup toolchain
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          rust-components: "true"

      # wasm-bindgen and wasm-opt (javascript/mise.toml, locked), the
      # wasm32-unknown-unknown target and the npm dev dependencies.
      - name: Browser toolchain
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools setup:js

      # rlmesh-session-core builds for wasm32-unknown-unknown, clippy denies
      # clock reads, threads and sleeps (its clippy.toml), and
      # no IO crate is a normal dependency on the wasm target.
      - name: Sans-IO guard
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools check:sans-io

      # wasm-bindgen-test under Node (no browser): decode, receive rules,
      # leases, garbage input as an error, and the std::time::Instant canary.
      - name: rlmesh-wasm tests under Node
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools test:js:wasm

      # cargo --profile wasm, wasm-bindgen --target web, wasm-opt -Oz, then
      # the esbuild bundles and the .d.ts files.
      - name: Build the wasm and javascript/rlmesh
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools build:js

      # The .wasm imports only wasm-bindgen glue (no env/WASI) and stays
      # under its gzip budget.
      - name: wasm import check and size budget
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools check:js:wasm

      - name: TypeScript strict typecheck
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools typecheck:js

      # Queue, backoff and reconnect, the Worker supervisor (trap -> respawn),
      # the session (leases revoked on a disconnect or a Worker restart,
      # peek/latest lifetimes). Fake Workers and sockets: no browser, robot or
      # gateway.
      - name: JS unit tests
        if: steps.changes.outputs.run == 'true'
        run: mise run --skip-tools test:js:unit
