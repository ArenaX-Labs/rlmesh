[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "mise run fmt:check:rust"
pass_filenames = false
types = ["rust"]

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "mise run lint:rust"
pass_filenames = false
types = ["rust"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "mise run fmt:check:python"
pass_filenames = false
types = ["python"]

[[repos.hooks]]
id = "ruff-lint"
name = "ruff check"
language = "system"
entry = "mise run lint:python"
pass_filenames = false
types = ["python"]

[[repos.hooks]]
id = "clang-format"
name = "clang-format"
language = "system"
entry = "mise run fmt:check:cxx"
pass_filenames = false
types_or = ["c", "c++"]

[[repos.hooks]]
id = "buf-lint"
name = "buf lint"
language = "system"
entry = "mise run lint:proto"
pass_filenames = false
files = "\\.proto$"

[[repos.hooks]]
id = "buf-format"
name = "buf format"
language = "system"
entry = "mise run fmt:check:proto"
pass_filenames = false
files = "\\.proto$"

[[repos.hooks]]
id = "config-format"
name = "config format"
language = "system"
entry = "mise run fmt:check:config"
pass_filenames = false
files = "\\.(md|toml|ya?ml|jsonc?)$"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "mise run lint:spelling"
pass_filenames = false

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
language = "system"
entry = "mise run lint:deps:deny"
pass_filenames = false
files = "^(Cargo\\.(toml|lock)|deny\\.toml|crates/[^/]+/Cargo\\.toml|python/rlmesh/rust/Cargo\\.toml)$"

[[repos.hooks]]
id = "rebuild-rlmesh-ext"
name = "rebuild _rlmesh extension"
language = "system"
entry = "scripts/rebuild_ext_if_stale.sh"
pass_filenames = false
always_run = true
stages = ["post-merge", "post-checkout"]
