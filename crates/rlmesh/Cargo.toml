[package]
name = "rlmesh"
description = "Internal RLMesh crate (unstable Rust API): Rust bindings for model-environment evaluation; build on the rlmesh Python package."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = { workspace = true }

# Example scraping is nightly-only; docs.rs builds nightly, the stable local/CI `cargo doc` does not.
[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
anyhow = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["form", "json", "query"], optional = true }
rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
zenoh = { workspace = true }
rlmesh-spaces = { workspace = true }
rlmesh-adapters = { workspace = true }
rlmesh-session = { workspace = true, features = ["record"] }
rlmesh-proto = { workspace = true }
prost = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures = { workspace = true }
image = { workspace = true, features = ["png"] }
rav1e = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
half = { workspace = true }
parquet = { workspace = true }
crossterm = { version = "0.29", optional = true }
tiny_http = { version = "0.12", optional = true }
indexmap = { workspace = true, features = ["serde"] }
rand = { workspace = true }
rayon = { workspace = true }
scoped-tls-hkt = "0.1.5"
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
re_mp4 = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[features]
default = ["managed", "viewer"]
managed = [
  "dep:anyhow",
  "dep:dirs",
  "dep:keyring",
  "dep:reqwest",
  "dep:rustls",
  "dep:security-framework",
  "dep:toml",
]
viewer = ["dep:crossterm", "dep:tiny_http", "image/jpeg"]

[lints]
workspace = true

[[example]]
name = "lockstep_bench"
