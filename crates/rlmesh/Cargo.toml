[package]
name = "rlmesh"
description = "Internal RLMesh crate (unstable Rust API): Rust bindings for model-environment evaluation; build on the rlmesh Python package."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = { workspace = true }

# docs.rs renders an "Examples found in repository" block on the API items each
# example calls. Scraping is nightly-only; docs.rs builds nightly, the stable
# local/CI `cargo doc` does not, so this flag stays out of the local doc build.
[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
async-trait = { workspace = true }
# The `lockstep` module (feature `lockstep`).
base64 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
zenoh = { workspace = true, optional = true }
rlmesh-spaces = { workspace = true }
rlmesh-adapters = { workspace = true }
rlmesh-grpc = { workspace = true }
# The v2 lockstep transport (`lockstep://` env addresses, protocol v2 §12).
rlmesh-session = { workspace = true, features = ["record"], optional = true }
rlmesh-proto = { workspace = true }
rlmesh-runtime = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = { workspace = true }
zip = { version = "2", default-features = false }
futures = { workspace = true }
image = { workspace = true, features = ["png"] }
# The recorder's in-process AV1 episode videos.
rav1e = { workspace = true }
# The live viewer (feature `viewer`): terminal and HTTP backends.
crossterm = { version = "0.29", optional = true }
tiny_http = { version = "0.12", optional = true }
indexmap = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
scoped-tls-hkt = "0.1.5"
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
re_mp4 = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tonic-health = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["viewer"]
# The live terminal/HTTP viewer behind `View`.
viewer = ["dep:crossterm", "dep:tiny_http", "image/jpeg"]
# Serve envs and drive models over the v2 lockstep path (`lockstep://`).
lockstep = [
  "dep:base64",
  "dep:blake3",
  "dep:bytes",
  "dep:prost",
  "dep:rlmesh-session",
  "dep:thiserror",
  "dep:zenoh",
  "serde_json/float_roundtrip",
  "tokio/macros",
]

[lints]
workspace = true

[[example]]
name = "lockstep_bench"
required-features = ["lockstep"]
