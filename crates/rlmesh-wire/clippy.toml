# Clippy reads the nearest clippy.toml and does not merge files, so this
# repeats the workspace's settings before the sans-IO bans.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Sans-IO: the wire never reads a clock, spawns or sleeps (times are fields).
# `std::time::Instant::now` compiles for wasm32-unknown-unknown and panics
# at run time ("time not implemented on this platform").
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "sans-IO: take the time as a `now_ns` argument" },
  { path = "std::time::SystemTime::now", reason = "sans-IO: take the time as a `now_ns` argument" },
  { path = "std::thread::spawn", reason = "sans-IO: no threads" },
  { path = "std::thread::sleep", reason = "sans-IO: never block" },
]
