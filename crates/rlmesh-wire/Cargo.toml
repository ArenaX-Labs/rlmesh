[package]
name = "rlmesh-wire"
description = "Internal RLMesh crate (unstable Rust API): the real-time session wire (protocol v2): messages, framing, versioning, key layout and ids."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Not released until the v0.2 wire spec freezes.
publish = false

[package.metadata.cargo-machete]
ignored = ["tonic-prost-build"]

[dependencies]
bytes = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
# Session ids parse and print everywhere; minting one (UUIDv7) reads the
# clock and the RNG, so `SessionId::new` exists on every target but the
# browser (wasm32-unknown-unknown has neither without JS glue).
uuid = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
