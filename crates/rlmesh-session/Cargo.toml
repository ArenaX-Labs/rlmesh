[package]
name = "rlmesh-session"
description = "Internal RLMesh crate (unstable Rust API): real-time sessions (protocol v2) on Zenoh: the session host, participants, clock offsets and per-class transport."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = true

[[bin]]
name = "rlmesh-gateway"
path = "src/bin/rlmesh-gateway.rs"
required-features = ["gateway"]

[dependencies]
axum = { workspace = true, features = ["ws"], optional = true }
blake3 = { workspace = true, optional = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
image = { workspace = true, features = ["jpeg"] }
jpeg-encoder = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
mcap = { workspace = true, optional = true }
rand = { workspace = true }
rlmesh-session-core = { workspace = true }
rustls = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true }
tower-http = { workspace = true, features = ["fs", "set-header"], optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"], optional = true }
# No `transport_multilink` or pubkey auth: both pull `rsa` (RUSTSEC-2023-0071).
# `unstable` is the only way Zenoh sets per-publisher reliability.
zenoh = { workspace = true, features = [
  "auth_usrpwd",
  "transport_tcp",
  "transport_unixsock-stream",
  "unstable",
] }
zeroize = { workspace = true }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
rcgen = { workspace = true }
rlmesh-wasm = { path = "../../javascript/rlmesh/wasm" }
serde_json = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[features]
default = ["record"]
gateway = [
  "dep:axum",
  "dep:blake3",
  "dep:clap",
  "dep:futures",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:tower-http",
  "dep:tracing-subscriber",
  "tokio/net",
]
# Unreleased: off in every release; CI builds and tests it.
fleet = ["dep:mdns-sd", "rlmesh-session-core/fleet"]
record = ["dep:mcap"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
