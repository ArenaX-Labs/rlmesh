[package]
name = "rlmesh-cli"
description = "Internal RLMesh crate (unstable Rust API): the rlmesh command-line binary."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = { workspace = true }
default-run = "rlmesh"

[[bin]]
name = "rlmesh"
path = "src/main.rs"

[[bin]]
name = "rlmeshd"
path = "src/bin/rlmeshd.rs"

[[bin]]
name = "docker-credential-rlmesh"
path = "src/bin/docker_credential_rlmesh.rs"

[features]
fleet = ["rlmesh-session/fleet"]
cockpit = ["dep:rlmesh-cockpit"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
rlmesh = { workspace = true, default-features = false, features = ["managed"] }
rlmesh-proto = { workspace = true }
rlmesh-cockpit = { workspace = true, optional = true }
rlmesh-session = { workspace = true, features = ["record"] }
rlmesh-tether = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = { workspace = true, features = ["preserve_order"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "process"] }

[lints]
workspace = true
