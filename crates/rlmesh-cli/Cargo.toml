[package]
name = "rlmesh-cli"
description = "Internal RLMesh crate (unstable Rust API): the rlmesh command-line binary."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = { workspace = true }
default-run = "rlmesh"

[[bin]]
name = "rlmesh"
path = "src/main.rs"

[[bin]]
name = "rlmeshd"
path = "src/bin/rlmeshd.rs"

[[bin]]
name = "docker-credential-rlmesh"
path = "src/bin/docker_credential_rlmesh.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
# `rlmesh eval report`: results of saved bundles; `doctor` and `bench` (lockstep);
# the platform client and profile store (managed).
rlmesh = { workspace = true, default-features = false, features = ["lockstep", "managed"] }
rlmesh-proto = { workspace = true }
# `rlmesh host`: v2 sessions over Zenoh, recorded (`record`).
rlmesh-session = { workspace = true, features = ["record"] }
# `rlmesh devices provision`: the tether's provisioning codec (spec §14).
rlmesh-tether = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `net`, `io-util` and `sync`: rlmeshd's local channel (a Unix socket).
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = { workspace = true, features = ["preserve_order"] }
# rlmeshd's keys (`host.key`, `local.key`) are wiped after use.
zeroize = { workspace = true }

# A board's serial port (termios, its modem lines) and the host name.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "process"] }

[lints]
workspace = true
