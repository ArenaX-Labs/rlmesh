[package]
name = "rlmesh-cli"
description = "Internal RLMesh crate (unstable Rust API): the rlmesh command-line binary."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = { workspace = true }
default-run = "rlmesh"

[[bin]]
name = "rlmesh"
path = "src/main.rs"

[[bin]]
name = "docker-credential-rlmesh"
path = "src/bin/docker_credential_rlmesh.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
# `rlmesh eval report`: results of saved bundles; `doctor` and `bench` (lockstep);
# the platform client and profile store (managed).
rlmesh = { workspace = true, default-features = false, features = ["lockstep", "managed"] }
rlmesh-proto = { workspace = true }
# `rlmesh host`: v2 sessions over Zenoh.
rlmesh-session = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "process"] }

[lints]
workspace = true
