[package]
name = "rlmesh-device"
description = "Internal RLMesh crate (unstable Rust API): the device runtime a networked board (an ESP32) links as a static library with a C header: the session's crypto and the robot edge over the no_std core, with the platform's clock and randomness passed in."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = false

[lib]
name = "rlmesh_device"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Not `workspace = true`: that entry keeps the default features (std).
rlmesh-session-core = { version = "=0.2.0-alpha.2", path = "../rlmesh-session-core", default-features = false, features = [
  "fleet",
] }
rlmesh-tether = { version = "=0.2.0-alpha.2", path = "../rlmesh-tether" }
zeroize = { version = "1", default-features = false }
bytes = { version = "1.9", default-features = false }

[dev-dependencies]
rlmesh-session = { workspace = true, features = ["record"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
zenoh = { workspace = true }

[[example]]
name = "lobby_board"
required-features = ["fleet"]

[features]
default = ["std"]
std = ["rlmesh-session-core/std"]
fleet = ["rlmesh-session/fleet"]

[lints]
workspace = true
