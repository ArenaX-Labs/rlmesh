syntax = "proto3";

package rlmesh.spaces.v1;

// Element dtypes for space leaves. Closed set under wire-v1: readers
// hard-reject unknown values; new dtypes require an edition gate.
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  DATA_TYPE_BOOL = 1;
  DATA_TYPE_UINT8 = 2;
  DATA_TYPE_UINT16 = 3;
  DATA_TYPE_UINT32 = 4;
  DATA_TYPE_UINT64 = 5;
  DATA_TYPE_INT8 = 6;
  DATA_TYPE_INT16 = 7;
  DATA_TYPE_INT32 = 8;
  DATA_TYPE_INT64 = 9;
  DATA_TYPE_FLOAT16 = 10;
  DATA_TYPE_FLOAT32 = 11;
  DATA_TYPE_FLOAT64 = 12;
}
