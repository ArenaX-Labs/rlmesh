syntax = "proto3";

package rlmesh.spaces.v1;

// Spec-directed value transport. The bytes are a pure function of the
// SpaceSpec both peers hold from handshake/ResolveAdapter; nothing on the
// wire is self-describing.
//
// Codec (normative):
// - One `leaves` entry per fundamental leaf of the SpaceSpec, in canonical
//   pre-order (Dict children in declared key order, Tuple in index order).
// - Each leaf is its raw element bytes, little-endian, at the leaf's declared
//   dtype width. Discrete encodes at the declared dtype; MultiBinary is one
//   byte per element (0 or 1). Text is raw UTF-8.
// - Batch of N: each leaf holds the row-major (N, *shape) slab — per-lane
//   bytes concatenated for fixed-stride leaves. Text slabs carry an explicit
//   header: [u64 count][u64 byte_len x count][utf8 bodies], u64 little-endian.
// - N is an authoritative decode input carried by the enclosing message,
//   NEVER derived by dividing byte lengths.
message SpaceValue {
  repeated bytes leaves = 1;
}
