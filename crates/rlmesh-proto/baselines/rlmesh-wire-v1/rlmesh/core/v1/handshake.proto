syntax = "proto3";

package rlmesh.core.v1;

// Versioning doctrine — one mechanism per axis:
// - `protocol_generation`: byte-contract identity (e.g. "rlmesh-wire-v1"),
//   matched by EXACT equality. A mismatch means the peers cannot exchange
//   bytes at all; there is no negotiation on this axis.
// - workflow editions: behavior versioning. Peers advertise
//   `supported_workflow_editions`; the runtime picks the highest edition
//   mutual across env, model, AND runtime (the 3-way floor, since the
//   relaying runtime drops fields it does not know) and pins both sides.
// - `capabilities`: advisory optional features; absence is always safe.
// The handshake decides exactly one thing: generation compatibility.
message PeerInfo {
  string component = 1;
  string package_version = 2;
  string language = 3;
  string language_version = 4;
  string os = 5;
  string os_version = 6;
  string arch = 7;
  map<string, string> framework_versions = 8;
  // Tags 9-14 are deliberate headroom for future structured peer facts.
  map<string, string> extra = 15;
}

message HandshakeRequest {
  string protocol_generation = 1;
  PeerInfo peer_info = 2;
  map<string, string> capabilities = 3;
  repeated string supported_workflow_editions = 4;
}

message HandshakeResponse {
  bool compatible = 1;
  PeerInfo peer_info = 2;
  map<string, string> capabilities = 3;
  repeated string supported_workflow_editions = 4;
  optional string error_message = 5;
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {
  bool accepted = 1;
  string message = 2;
}
