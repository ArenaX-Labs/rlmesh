[package]
name = "rlmesh-proto"
description = "Internal RLMesh crate (unstable Rust API): internal driver data types and workflow editions."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Published as an internal dependency of `rlmesh` and `rlmesh-cli`.
publish = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost-build"]

# The build script invokes `protoc` to generate internal data types. The docs.rs
# build image ships `protoc` (via the crates-build-env `protobuf-compiler`
# package), so no extra escape hatch is needed; this block documents the docs.rs
# build expectations and renders all targets.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
