syntax = "proto3";

package rlmesh.model.v1;

import "rlmesh/core/v1/env_contract.proto";
import "rlmesh/spaces/v1/value.proto";

// Runtime-owned adapter execution context.
message AdapterContext {
  // Correlation label for telemetry and logs; routing uses `env_id`.
  string session_id = 1;
  // The connected env container this adapter serves (UUIDv7, minted by the
  // runtime on env attach).
  string env_id = 2;
  // The producer's correlation id for this request.
  string request_id = 3;
}

message ResolveAdapterRequest {
  // The env whose adapter is being resolved.
  AdapterContext context = 1;

  // Stable env spec for all later Predict calls on this env.
  rlmesh.core.v1.EnvSpec env_spec = 2;

  // Highest mutual workflow edition across env, model, and runtime (the
  // floor, see handshake.proto).
  string selected_workflow_edition = 3;

  // Execution horizon h: how many actions of each predicted chunk the runtime
  // executes before re-planning, chosen by the runtime and pinned here (runtime-
  // local scheduling, exactly like selected_workflow_edition above).
  uint32 execution_horizon = 4;

  // The runtime's declaration that it will deliver observation history on
  // Predict: every env step it executed from a replayed chunk WITHOUT
  // predicting arrives as `PredictRequest.history` on the next predict, so a
  // model whose adapter keeps a frame window sees every step, not only the
  // decision points.
  bool delivers_history = 5;
}

// What a resolved route's adapter keeps a frame window for, answered when the
// runtime offered history (`delivers_history`) and the adapter stacks frames.
message ObservationHistoryNeeds {
  // The stacked inputs' canonical placement keys (informational today: the
  // runtime sends the whole observation per history row).
  repeated string keys = 1;
  // Reserved for pruned history rows (only the keys' leaves): a runtime may
  // prune only when the model set this.
  bool prunable = 2;
}

message ResolveAdapterResponse {
  // The model's NATIVE chunk length K: how many per-step actions one chunk
  // corner call returns, when the model declares it.
  optional uint32 native_chunk = 1;

  // Set when the runtime offered history and this route's adapter needs it.
  ObservationHistoryNeeds history = 2;
}

// One env step the runtime executed without predicting (a replayed chunk
// frame), delivered on the next Predict so the model-side frame windows advance
// on every step.
message ObservationHistoryFrame {
  rlmesh.spaces.v1.SpaceValue observation = 1;
  repeated EpisodeInfo episode_info = 2;
  // The producer's per-group env-step counter at this frame (see
  // `PredictRequest.step`).
  int64 step = 3;
}

// Per-row episode identity and seed metadata: the self-describing batch.
message EpisodeInfo {
  // Minted by the runtime (UUIDv7); never repeats.
  string episode_id = 1;
  optional int64 seed = 2;
}

// Observation sent from the runtime to the model.
message PredictRequest {
  // Runtime adapter identity.
  AdapterContext context = 1;

  // Observation data encoded per env observation space.
  rlmesh.spaces.v1.SpaceValue observation = 2;

  // Ordered per-row episode identity and seed metadata.
  repeated EpisodeInfo episode_info = 3;

  // The env steps executed since the previous predict on this route WITHOUT a
  // predict (replayed chunk frames), oldest first.
  repeated ObservationHistoryFrame history = 4;

  // The producer's per-group env-step counter at `observation`: one step per
  // env.step of the group, so consecutive observations of one episode carry
  // consecutive values (a history row's `step` is one less than the next
  // row's, and the last row's is one less than this).
  optional int64 step = 5;
}

message PredictResponse {
  // Adapter identity copied from the request this action answers.
  AdapterContext context = 1;

  // Ordered action frames for this predict: actions[0] is THIS step, actions[1..]
  // are open-loop replay frames.
  repeated rlmesh.spaces.v1.SpaceValue actions = 2;
}

// One request carrying N independent predict groups (caller-decided
// grouping).
message GroupedPredictRequest {
  repeated PredictRequest groups = 1;
}

// Per-group outcome; `results[i]` corresponds to
// `GroupedPredictRequest.groups[i]` in order.
message GroupedPredictResult {
  oneof outcome {
    PredictResponse response = 1;
    ModelError error = 2;
  }
}

message GroupedPredictResponse {
  repeated GroupedPredictResult results = 1;
}

message ReleaseAdapterRequest {
  AdapterContext context = 1;
  string reason = 2;
}

message ReleaseAdapterResponse {}

// Drop per-episode adapter state (frame-stack buffers) for an env.
message ResetAdapterRequest {
  AdapterContext context = 1;
  repeated string episode_ids = 2;
}

message ResetAdapterResponse {}

// Request graceful shutdown of the model participant after the runtime reaches
// a normal terminal condition.
message CloseParticipantRequest {
  string reason = 1;
}

message CloseParticipantResponse {}

// Bands (aligned with EnvErrorCode; UNSPECIFIED and shared concepts share
// numbers across the two enums): 0 = unspecified; 1-9 client/recoverable;
// 10-19 fatal/internal. Readers must consult `is_recoverable`, not the band.
enum ModelErrorCode {
  MODEL_ERROR_CODE_UNSPECIFIED = 0;
  MODEL_ERROR_CODE_INVALID_REQUEST = 2;
  MODEL_ERROR_CODE_NOT_CONFIGURED = 3;
  MODEL_ERROR_CODE_BUSY = 4;
  // The request is well-formed but names a feature this peer does not
  // support yet.
  MODEL_ERROR_CODE_UNSUPPORTED = 5;
  MODEL_ERROR_CODE_INTERNAL = 10;
  MODEL_ERROR_CODE_CANCELLED = 12;
  MODEL_ERROR_CODE_CLOSED = 13;
}

message ModelError {
  ModelErrorCode code = 1;
  string message = 2;
  bool is_recoverable = 3;
  string debug_info = 4;
}

message JoinRequest {
  oneof kind {
    ResolveAdapterRequest resolve_adapter = 1;
    PredictRequest predict = 2;
    ReleaseAdapterRequest release_adapter = 3;
    CloseParticipantRequest close = 4;
    GroupedPredictRequest grouped_predict = 6;
    ResetAdapterRequest reset_adapter = 7;
  }

  string request_id = 5;
}

message JoinResponse {
  oneof kind {
    ResolveAdapterResponse resolve_adapter = 1;
    PredictResponse predict = 2;
    ReleaseAdapterResponse release_adapter = 3;
    CloseParticipantResponse close = 4;
    GroupedPredictResponse grouped_predict = 7;
    ResetAdapterResponse reset_adapter = 8;
    ModelError error = 10;
  }

  string request_id = 5;

  // Hot per-step endpoint-local op duration, in nanoseconds.
  optional uint64 endpoint_total_ns = 6;

  // Split of `endpoint_total_ns` (ns): wire decode of the request, the handler's
  // own work, wire encode of the response.
  optional uint64 decode_ns = 11;
  optional uint64 user_ns = 12;
  optional uint64 encode_ns = 13;

  // Wait before this request's handler ran: concurrency permit, per-route
  // ordering gate, and handler lock.
  optional uint64 queue_ns = 14;

  // Requests holding a concurrency slot on this endpoint when this request
  // was dispatched to its handler (after its per-route gate), including this
  // one.
  optional uint32 in_flight = 15;

  // Adapter work inside the handler's own time (ns): observation assembly plus
  // action apply.
  optional uint64 adapter_ns = 16;

  // Engine-held per-episode adapter state when this response was stamped:
  // episodes with live frame-stack windows across the endpoint's routes, and
  // the bytes those windows hold.
  optional uint32 held_episodes = 17;
  optional uint64 held_state_bytes = 18;
}
