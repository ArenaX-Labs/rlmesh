syntax = "proto3";

package rlmesh.core.v1;

// Internal build diagnostics used in describe envelopes.
message PeerInfo {
  string component = 1;
  string package_version = 2;
  string language = 3;
  string language_version = 4;
  string os = 5;
  string os_version = 6;
  string arch = 7;
  map<string, string> framework_versions = 8;
  // Tags 9-14 are deliberate headroom for future structured peer facts.
  map<string, string> extra = 15;
}
