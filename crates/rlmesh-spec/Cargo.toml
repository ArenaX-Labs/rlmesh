[package]
name = "rlmesh-spec"
description = "Internal RLMesh crate (unstable Rust API): the physical-AI layer of a real-time session (protocol v2): the robot map and its kind table, policy maps, binding with refuse-and-explain, conversions and delivery contracts."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Not released until the v0.2 wire spec freezes.
publish = false

[dependencies]
# Declaration and binding fingerprints are BLAKE3 over RFC 8785 JSON (§3.3).
blake3 = { workspace = true }
rlmesh-wire = { workspace = true }
# Robot and policy maps are authored JSON (§3, §6); field order is payload
# order, so the normaliser reads objects with an order-keeping visitor.
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }

[lints]
workspace = true
