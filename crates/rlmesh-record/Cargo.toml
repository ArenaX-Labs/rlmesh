[package]
name = "rlmesh-record"
description = "Internal RLMesh crate (unstable Rust API): MCAP recording of a real-time session (protocol v2): streams, applied commands, action chunks and authority changes."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Not released until the v0.2 wire spec freezes.
publish = false

[dependencies]
bytes = { workspace = true }
# MCAP (Foxglove, MIT). No compression features: payloads are raw tensors
# and camera frames, written as they arrived (§13).
mcap = { workspace = true }
rlmesh-session = { workspace = true }
rlmesh-wire = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing = { workspace = true }
zenoh = { workspace = true }

[dev-dependencies]
rlmesh-edge = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
