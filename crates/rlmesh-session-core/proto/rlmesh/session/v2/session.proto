// RLMesh real-time session wire, generation 2 (the v0.2 spec, §10).
//
// Every message is plain protobuf, one message per Zenoh payload; the key
// says which message it is. Samples, batches and action chunks carry their
// values as one raw `bytes` payload, packed in the layout the host derived
// from the part's declaration (§10.6).
//
// Compatibility: additive only. New fields, verbs and enum values; never
// renumber or retype. A feature added in a protocol minor is a feature
// string (Attach.supports/requires, AuthorityState.supports,
// PartSpec.requires). Field numbers the spec reserves for messages not built
// yet (episodes) are left unused.
syntax = "proto3";

package rlmesh.session.v2;

// What a participant does in a session. One participant may hold several.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Publishes a robot's parts and consumes their commands (real, sim or twin).
  ROLE_EMBODIMENT = 1;
  // Produces commands (model replica, operator or scripted controller).
  ROLE_CONTROLLER = 2;
  // Only subscribes (twin renderer, recorder, dashboard).
  ROLE_OBSERVER = 3;
}

// The host-owned session mode.
enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_DISARMED = 1;
  MODE_ARMED = 2;
  MODE_ACTIVE = 3;
  MODE_SAFE = 4;
  // Latched: leaving it needs a local clear, then disarm, then arm.
  MODE_ESTOP = 5;
}

// Lease arbitration class: a higher class preempts a lower one.
enum PriorityClass {
  PRIORITY_CLASS_UNSPECIFIED = 0;
  PRIORITY_CLASS_SCRIPTED = 1;
  PRIORITY_CLASS_MODEL = 2;
  PRIORITY_CLASS_OPERATOR = 3;
  PRIORITY_CLASS_SAFETY = 4;
}

// How session time advances (§11.2).
enum ClockMode {
  CLOCK_MODE_UNSPECIFIED = 0;
  CLOCK_MODE_WALL = 1;
  CLOCK_MODE_VIRTUAL = 2;
  CLOCK_MODE_LOCKSTEP = 3;
}

message ParticipantInfo {
  string id = 1;
  string name = 2;
  repeated Role roles = 3;
  PriorityClass priority = 4;
  // Host session clock when the participant (last) attached.
  int64 attached_ns = 5;
  uint32 protocol_minor = 6;
  // Features it implements and features it cannot run without.
  repeated string supports = 7;
  repeated string requires = 8;
}

// A time-bounded grant of command authority over one commandable part,
// bound to one binding.
message Lease {
  uint32 channel = 1;
  string holder = 2;
  PriorityClass priority = 3;
  // Unique and increasing per session: a preemption or a rebinding issues a
  // new one, which fences the old holder's in-flight chunks.
  uint64 token = 4;
  uint64 ttl_ns = 5;
  // Host session clock.
  int64 granted_ns = 6;
  int64 expires_ns = 7;
  // The binding fingerprint (8 bytes) every chunk under this lease carries.
  bytes binding = 8;
}

// session_ns = participant_ns + offset_ns, within ± error_ns.
message ClockMapping {
  string participant = 1;
  int64 offset_ns = 2;
  uint64 error_ns = 3;
  double drift_bound_ppm = 4;
  // Round trip of the sample the offset came from (the window minimum).
  uint64 rtt_ns = 5;
  // Host session clock of that sample.
  int64 sample_ns = 6;
}

// How a subscriber is delivered one stream (§8.2).
enum ContractMode {
  CONTRACT_MODE_UNSPECIFIED = 0;
  // The newest sample, at most delivery_hz times per second.
  CONTRACT_MODE_LATEST = 1;
  // Every sample, as soon as it is published; the subscriber keeps the window.
  CONTRACT_MODE_HISTORY = 2;
  // Every sample, as soon as it is published.
  CONTRACT_MODE_EVERY = 3;
}

// One subscriber's delivery contract on one stream, fixed at attach.
message StreamContract {
  // A part's stream or a commandable part's _applied stream.
  uint32 channel = 1;
  ContractMode mode = 2;
  // D.
  double delivery_hz = 3;
  // The deepest window on the stream; 1 is none.
  uint32 history = 4;
  // The effective freshness bound after precedence (§8.7); 0 for events.
  uint64 max_age_ns = 5;
  bool max_age_explicit = 6;
}

// The action grid a binding declared for one commanded part: a chunk with
// dt_ns = 0 takes this dt.
message ActionGrid {
  uint32 channel = 1;
  uint64 dt_ns = 2;
}

// How a publisher sends one stream.
enum PlanKind {
  PLAN_KIND_UNSPECIFIED = 0;
  // Each sample immediately (any every or history contract).
  PLAN_KIND_EVERY = 1;
  // Was INCREMENTS: wire batching of history windows, removed.
  reserved 2;
  reserved "PLAN_KIND_INCREMENTS";
  // The newest sample at latest_hz, coalescing older ones.
  PLAN_KIND_LATEST = 3;
}

// A stream's publication plan, derived by the host from every admitted
// contract on it. A stream with no demand publishes every sample within its
// send ceiling.
message Demand {
  uint32 channel = 1;
  // Bumps whenever the plan changes; from 1.
  uint64 revision = 2;
  PlanKind plan = 3;
  // Were the INCREMENTS flush interval and caps.
  reserved 4, 5, 6;
  reserved "flush_ns", "max_records", "max_bytes";
  // LATEST.
  double latest_hz = 7;
  // How long the publisher's ring retains samples.
  uint64 retain_ns = 8;
  // The newest revision the publisher acknowledged; 0 is none.
  uint64 acked = 9;
}

// A controller's declared binding, as the host recorded it.
message BindingRecord {
  string participant = 1;
  bytes fingerprint = 2;
  uint32 revision = 3;
  string table_json = 4;
  // The commandable parts it may lease.
  repeated uint32 channels = 5;
  // Its replan rate R: in virtual mode, the ticks it is due on.
  double replan_hz = 6;
  // One per bound input stream.
  repeated StreamContract contracts = 7;
  // One per commanded part.
  repeated ActionGrid grids = 8;
}

// The host's authority snapshot.
message AuthorityState {
  string session = 1;
  uint64 epoch = 2;
  // Bumps on every structural change; periodic republishes keep it.
  uint64 revision = 3;
  Mode mode = 4;
  bool estop_latched = 5;
  repeated ParticipantInfo roster = 6;
  repeated Lease leases = 7;
  repeated ClockMapping clocks = 8;
  // Host session clock when this snapshot was taken.
  int64 host_ns = 9;
  // Every declared part, host-normalised.
  repeated PartSpec parts = 10;
  // The host's protocol minor.
  uint32 protocol_minor = 11;
  // Features the host implements.
  repeated string supports = 12;
  ClockMode clock_mode = 13;
  // Session time per tick (virtual and lockstep modes).
  uint64 tick_ns = 14;
  repeated BindingRecord bindings = 16;
  // Robot -> its declaration fingerprint (8 bytes): BLAKE3 over the
  // canonical form of its normalised map (§3.3).
  map<string, bytes> contract = 17;
  // The publication plan of every stream some binding has a contract on.
  repeated Demand demands = 18;
}

// One NTP-style exchange: t1 and t4 in the participant's clock, t2 and t3 in
// the host's.
message TimingSample {
  uint64 seq = 1;
  int64 t1_ns = 2;
  int64 t2_ns = 3;
  int64 t3_ns = 4;
  int64 t4_ns = 5;
}

// A participant's self-reported health.
enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_OK = 1;
  HEALTH_DEGRADED = 2;
  HEALTH_UNHEALTHY = 3;
}

message ChannelSeq {
  uint32 channel = 1;
  uint64 seq = 2;
}

// Participant -> host, control class.
message Heartbeat {
  string participant = 1;
  // The participant's view of the epoch and mode.
  uint64 epoch = 2;
  Mode mode = 3;
  uint64 seq = 4;
  // Participant clock at send.
  int64 t1_ns = 5;
  // The previous exchange, completed with its t4.
  TimingSample previous = 6;
  repeated ChannelSeq last_seq_seen = 7;
  uint64 last_chunk_accepted = 8;
  uint64 last_chunk_applied = 9;
  uint32 queue_depth = 10;
  Health health = 11;
}

// Host -> participant, control class.
message HeartbeatEcho {
  uint64 seq = 1;
  int64 t1_ns = 2;
  int64 t2_ns = 3;
  int64 t3_ns = 4;
  uint64 epoch = 5;
}

// Observer telemetry (§8.10): what only the measuring side knows, published
// on p/{participant}/report, data class, a few times per second. Counters
// are cumulative since the participant attached; observers derive rates
// from their deltas on the sender's clock (sent_ns). Nothing acts on them.
message ParticipantReport {
  string participant = 1;
  uint64 epoch = 2;
  // Sender clock at send.
  int64 sent_ns = 3;
  // One per stream this participant publishes.
  repeated PublisherCounters streams = 4;
  // A controller runtime's counters; absent for anything else.
  RunCounters run = 5;
}

// Publisher side of one stream: produced = published + coalesced.
message PublisherCounters {
  uint32 channel = 1;
  // Samples sent (the stream's last seq).
  uint64 published = 2;
  // Samples the publication plan or the send ceiling coalesced.
  uint64 coalesced = 3;
}

// A controller runtime's start and completion counters (§8.9, §8.10).
message RunCounters {
  uint64 starts = 1;
  uint64 completions = 2;
  // Skipped start slots, by reason.
  uint64 busy_skips = 3;
  uint64 waiting_for = 4;
  uint64 stale_input = 5;
  uint64 window_gap = 6;
  uint64 decode = 7;
  uint64 no_lease = 8;
  uint64 chunks_sent = 9;
  // Age of the inference in flight; 0 when none is.
  uint64 pending_ns = 10;
  uint64 latency_p50_ns = 11;
  uint64 latency_p99_ns = 12;
  // The completion rate is outside [0.8, 1.25] x the replan rate.
  bool drifting = 13;
}

// Parts (§3, §10.5).

enum ChannelPriority {
  CHANNEL_PRIORITY_UNSPECIFIED = 0;
  CHANNEL_PRIORITY_CONTROL = 1;
  CHANNEL_PRIORITY_REALTIME = 2;
  CHANNEL_PRIORITY_DATA = 3;
  CHANNEL_PRIORITY_BULK = 4;
}

enum MergePolicy {
  MERGE_POLICY_UNSPECIFIED = 0;
  MERGE_POLICY_REPLACE = 1;
  MERGE_POLICY_BLEND = 2;
  MERGE_POLICY_RTC_PREFIX = 3;
}

// One field of a sample or an action: a dense little-endian row-major
// tensor.
message FieldSpec {
  string name = 1;
  // v1 DType codes (rlmesh-spaces); utf8 = 32.
  uint32 dtype = 2;
  repeated uint32 shape = 3;
  string unit = 4;
  // The rotation encoding, for rotation fields.
  string rotation = 5;
}

// Bounds on one command field: (low, high) broadcast or per element, or a
// norm bound.
message FieldLimit {
  string field = 1;
  repeated double low = 2;
  repeated double high = 3;
  double max_norm = 4;
}

// What a commandable part accepts.
message Command {
  string mode = 1;
  // One action's layout.
  repeated FieldSpec fields = 2;
  repeated FieldLimit limits = 3;
  string safe_behavior = 4;
  uint64 hold_max_ns = 5;
  uint64 max_action_age_ns = 6;
  // REPLACE only.
  MergePolicy merge = 7;
  string reference = 8;
  string group = 9;
  bool binary = 10;
  // During Hold, may the edge repeat the last dispatched target? Set for
  // position-type modes (§9.5); otherwise it runs the safe behaviour.
  bool hold_last = 11;
}

// A part as the host normalised it, in AuthorityState.
message PartSpec {
  string path = 1;
  string kind = 2;
  // Never reused within the session.
  uint32 channel = 3;
  // 0 unless commandable.
  uint32 applied_channel = 4;
  // The sample layout, in payload order.
  repeated FieldSpec fields = 5;
  // Source rate; 0 for events.
  double hz = 6;
  string send = 7;
  string frame = 8;
  repeated string names = 9;
  // "raw" | "jpeg".
  string encoding = 10;
  uint32 quality = 11;
  uint64 max_age_ns = 12;
  Command command = 13;
  map<string, string> attrs = 14;
  ChannelPriority priority = 15;
  // The robot: the embodiment that declared it.
  string owner = 16;
  bool event = 17;
  // Features a consumer must implement to use it.
  repeated string requires = 18;
  // Edge control rate; commandable parts only.
  double control_hz = 19;
}

// Control verbs.

message Attach {
  string name = 1;
  repeated Role roles = 2;
  PriorityClass priority = 3;
  // The participant's protocol minor.
  uint32 protocol_minor = 4;
  // Features this participant implements.
  repeated string supports = 5;
  // Features it cannot run without; the host refuses the attach
  // (CTL_STATUS_INCOMPATIBLE) when it lacks one.
  repeated string requires = 6;
}

message Detach {}

message Arm {}

message Disarm {}

// Embodiment -> host: the robot map; the host normalises it.
message DeclareParts {
  // The kind table version: 1.
  uint32 spec_version = 1;
  // The authored map, as JSON.
  string robot_json = 2;
}

// Controller -> host.
message DeclareBinding {
  // 8 bytes.
  bytes fingerprint = 1;
  uint32 revision = 2;
  string table_json = 3;
  // The parts it will command.
  repeated uint32 channels = 4;
  // One per bound input stream.
  repeated StreamContract contracts = 5;
  // Its replan rate R (virtual mode: the ticks it is due on); 0 = never due.
  double replan_hz = 6;
  // One per commanded part.
  repeated ActionGrid grids = 7;
}

// All or none.
message GrantLease {
  repeated uint32 channels = 1;
  // Released in the same revision (a switch within a group).
  repeated uint32 release = 2;
  bytes binding = 3;
  // Zero takes the session's lease grace.
  uint64 ttl_ns = 4;
}

message ReleaseLease {
  repeated uint32 channels = 1;
  uint64 token = 2;
}

message Estop {
  string reason = 1;
}

message Clear {}

// An embodiment's edge fell back on its own account: ACTIVE goes SAFE.
message EnterSafe {
  string reason = 1;
}

message Watermark {
  uint32 channel = 1;
  uint64 seq = 2;
}

// Publisher -> host: the plan of demand revision `revision` is installed.
message DemandAck {
  uint32 channel = 1;
  uint64 revision = 2;
}

// One chunk, by identity.
message ChunkRef {
  uint32 channel = 1;
  uint64 lease_token = 2;
  uint64 seq = 3;
}

// Virtual mode (§11.3), embodiment -> host: tick k's samples are published.
message Ready {
  uint64 tick = 1;
  // The last seq per stream.
  repeated Watermark watermarks = 2;
}

// Virtual mode, due controller -> host: its decision for tick k.
message Decided {
  uint64 tick = 1;
  repeated ChunkRef chunks = 2;
}

// A control verb, the payload of a query on `ctl`.
message CtlRequest {
  string participant = 1;
  // The epoch the verb was issued against; zero skips the check.
  uint64 epoch = 2;
  oneof verb {
    Attach attach = 10;
    Detach detach = 11;
    Arm arm = 12;
    Disarm disarm = 13;
    GrantLease grant_lease = 14;
    ReleaseLease release_lease = 15;
    Estop estop = 16;
    Clear clear = 17;
    DeclareParts declare_parts = 18;
    EnterSafe enter_safe = 19;
    DeclareBinding declare_binding = 20;
    DemandAck demand_ack = 24;
    Ready ready = 25;
    Decided decided = 26;
  }
}

enum CtlStatus {
  CTL_STATUS_UNSPECIFIED = 0;
  CTL_STATUS_OK = 1;
  CTL_STATUS_INVALID_REQUEST = 2;
  CTL_STATUS_NOT_ATTACHED = 3;
  CTL_STATUS_FORBIDDEN = 4;
  CTL_STATUS_INVALID_TRANSITION = 5;
  CTL_STATUS_ESTOP_LATCHED = 6;
  CTL_STATUS_STALE_EPOCH = 7;
  CTL_STATUS_STALE_TOKEN = 8;
  CTL_STATUS_LEASE_BUSY = 9;
  // 10 was PATH_CONFLICT before v0.2 froze: paths are scoped per robot, so
  // no declaration can conflict with another owner's. Never reuse it.
  // No such (commandable) part.
  CTL_STATUS_UNKNOWN_PATH = 11;
  CTL_STATUS_UNSUPPORTED = 12;
  // The sender requires a feature (or protocol) the session lacks.
  CTL_STATUS_INCOMPATIBLE = 13;
  // A member of the part's command group is held by an equal or higher
  // class (or by the requester, without releasing it).
  CTL_STATUS_GROUP_BUSY = 14;
  // A lease on a part outside the requester's binding.
  CTL_STATUS_NOT_BOUND = 15;
  // A lease requested before every stream of the binding has installed a
  // plan that includes its contract.
  CTL_STATUS_NOT_READY = 16;
}

message CtlReply {
  CtlStatus status = 1;
  string message = 2;
  // The authority snapshot right after the verb, accepted or not.
  AuthorityState state = 3;
  // Granted leases, one per channel.
  repeated Lease leases = 4;
}

// Virtual mode, host -> participants on `host/tick` (§11.3).
message TickState {
  uint64 epoch = 1;
  uint64 tick = 2;
  repeated Watermark watermarks = 3;
  // Controllers whose policy period falls on this tick.
  repeated string due = 4;
}

message Step {
  uint64 epoch = 1;
  uint64 tick = 2;
  // The chunks scheduled for delivery at this tick.
  repeated ChunkRef chunks = 3;
}

message VirtualTick {
  oneof phase {
    TickState observe = 1;
    Step step = 2;
  }
}

// Data (§10.6).

// What the edge did on one control tick (the `_applied` streams).
enum EdgeMode {
  EDGE_MODE_UNSPECIFIED = 0;
  EDGE_MODE_IDLE = 1;
  EDGE_MODE_DRIVING = 2;
  EDGE_MODE_HOLD = 3;
  EDGE_MODE_SAFE = 4;
  EDGE_MODE_ESTOP = 5;
}

message Applied {
  EdgeMode mode = 1;
  bool present = 2;
  uint64 lease_token = 3;
  uint64 chunk_seq = 4;
  uint32 action_index = 5;
}

// On d/{robot}/{path} (and d/{robot}/{path}/_applied).
message Sample {
  uint32 channel = 1;
  uint64 epoch = 2;
  // Per stream, from 1; a gap is a loss.
  uint64 seq = 3;
  // Publisher clock (wall) or session time (virtual/lockstep).
  int64 capture_ns = 4;
  int64 publish_ns = 5;
  // 0 in wall mode.
  uint64 tick = 6;
  // The packed fields, or one encoded image, or UTF-8.
  bytes payload = 7;
  // `_applied` streams only.
  Applied applied = 8;
}

message SampleMeta {
  uint64 seq = 1;
  int64 capture_ns = 2;
  uint64 tick = 3;
  Applied applied = 4;
}

message SeqRange {
  uint64 first = 1;
  uint64 last = 2;
}

// History-store pages (attach, swap and gap recovery); live samples travel
// one per Sample.
message SampleBatch {
  uint32 channel = 1;
  uint64 epoch = 2;
  int64 publish_ns = 3;
  // One per sample, in seq order; gaps allowed.
  repeated SampleMeta samples = 4;
  // samples.size() x stride (one sample of an unbatchable stream).
  bytes payload = 5;
  // History replies: retention ran out before the requested range.
  bool truncated = 6;
  // History replies: seqs known missing.
  repeated SeqRange gaps = 7;
}

// The payload of a query on h/{robot}/{path}.
message HistoryQuery {
  uint64 epoch = 1;
  // Samples with after_seq < seq <= until_seq; until_seq 0 is unbounded.
  uint64 after_seq = 2;
  uint64 until_seq = 3;
  // At most this many samples (the newest of the range); 0 takes the
  // store's cap.
  uint32 limit = 4;
}

message InputRange {
  uint32 channel = 1;
  uint64 seq_first = 2;
  uint64 seq_last = 3;
}

// On c/{robot}/{path}. Times are session time.
message ActionChunk {
  uint32 channel = 1;
  uint64 epoch = 2;
  // From the host; fences stale controllers.
  uint64 lease_token = 3;
  // Per lease token, increasing.
  uint64 seq = 4;
  // The binding fingerprint of the lease.
  bytes binding = 5;
  repeated InputRange based_on = 6;
  int64 t0_ns = 7;
  // Zero takes the action grid of the lease's binding (else the part's
  // control period).
  uint64 dt_ns = 8;
  int64 replace_from_ns = 9;
  // The whole chunk is void at and after this.
  int64 valid_until_ns = 10;
  uint32 count = 11;
  // count x command stride.
  bytes actions = 12;
  // Sender's clock at publish.
  int64 publish_ns = 13;
  uint64 tick = 14;
  // The controller that computed it; the edge checks it holds the lease.
  string source = 15;
}

// Lockstep fast path (§12): one request/reply per step on l/{robot}.

// An N-lane slab of one part: lanes x stride.
message PartValues {
  uint32 channel = 1;
  bytes payload = 2;
}

message LockstepReset {
  uint64 epoch = 1;
  // Empty = all lanes.
  repeated uint32 lanes = 2;
  // Aligned with lanes when present.
  repeated uint64 seeds = 3;
  string options_json = 4;
  // Minted by the driver, as v1.
  repeated uint64 episode_ids = 5;
}

message LockstepStep {
  uint64 epoch = 1;
  uint64 step = 2;
  uint64 lease_token = 3;
  // Empty = all lanes.
  repeated uint32 lanes = 4;
  repeated PartValues commands = 5;
}

message LockstepReply {
  uint64 epoch = 1;
  uint64 step = 2;
  // Every published part that changed this step.
  repeated PartValues observations = 3;
  // f32 [N].
  bytes reward = 4;
  // bool [N].
  bytes terminated = 5;
  // bool [N].
  bytes truncated = 6;
  // Per lane, after autoreset.
  repeated uint64 episode_ids = 7;
  // Only when record_info is on.
  string info_json = 8;
}
