[package]
name = "rlmesh-session-core"
description = "Internal RLMesh crate (unstable Rust API): the sans-IO state machines of a real-time session (protocol v2): authority, leases, the virtual clock, clock offsets, input caches, start schedules and stream receive rules."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = true

[package.metadata.cargo-machete]
ignored = ["tonic-prost-build"]

# Sans-IO: no runtime, sockets, threads, clock reads or RNG. It builds for
# wasm32-unknown-unknown, and `mise run check:sans-io` keeps it that way
# (clippy.toml here bans the clock and thread calls).
[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
