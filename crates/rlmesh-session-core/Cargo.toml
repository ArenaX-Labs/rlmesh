[package]
name = "rlmesh-session-core"
description = "Internal RLMesh crate (unstable Rust API): the sans-IO state machines of a real-time session (protocol v2): authority, leases, the virtual clock, clock offsets, input caches, start schedules, stream receive rules and the robot edge. Builds without std."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
publish = true

[package.metadata.cargo-machete]
ignored = ["poly1305", "tonic-prost-build"]

# Sans-IO: must build for wasm32-unknown-unknown and without std; `mise run check:sans-io` checks it.
[dependencies]
# Not `workspace = true`: a member can't turn off the workspace entries' default features.
blake3 = { version = "1", default-features = false }
bytes = { version = "1.9", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_path_to_error = { version = "0.1", default-features = false }
thiserror = { version = "2", default-features = false }
uuid = { version = "1", default-features = false }
libm = "0.2"
# snow's randomness is the caller's (`crypto::Rng`): no `use-getrandom`, no snow `std`.
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
snow = { version = "0.10", default-features = false, features = [
  "default-resolver",
  "use-chacha20poly1305",
  "use-blake2",
  "use-curve25519",
  "risky-raw-split",
] }
# Only to turn on `zeroize` for chacha20poly1305's MAC.
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
fleet = []
std = [
  "blake2/std",
  "blake3/std",
  "bytes/std",
  "chacha20poly1305/std",
  "ed25519-dalek/fast",
  "ed25519-dalek/std",
  "prost/std",
  "serde/std",
  "serde_json/std",
  "subtle/std",
  "thiserror/std",
  "uuid/std",
  "zeroize/std",
]

# Time-ordered ids need a clock and an RNG: not in the browser, not on bare metal.
[target.'cfg(not(any(all(target_arch = "wasm32", target_os = "unknown"), target_os = "none")))'.dependencies]
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
prost-types = "0.14"

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
