[package]
name = "rlmesh-cockpit"
description = "Internal RLMesh crate (unstable Rust API): the cockpit, a native single-session viewer of a real-time session (protocol v2): live channels, declared vs measured rates, the lease and mode timeline, and arm and e-stop."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = "README.md"
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Not released until the v0.2 wire spec freezes.
publish = false

[[bin]]
name = "rlmesh-cockpit"
path = "src/main.rs"

[package.metadata.cargo-machete]
# A dev-dependency for its `png` feature only: the render tests save
# egui_kittest's frames as PNG.
ignored = ["image"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
eframe = { workspace = true }
egui = { workspace = true }
half = { workspace = true }
rlmesh-session = { workspace = true }
rlmesh-wire = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
zenoh = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { workspace = true, features = ["png"] }

[lints]
workspace = true
