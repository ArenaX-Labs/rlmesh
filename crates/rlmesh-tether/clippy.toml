# Clippy does not merge clippy.toml files: repeat the workspace's settings.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# `Instant::now` compiles for wasm32-unknown-unknown but panics at run time.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "sans-IO: take the time as a `now_ns` argument" },
  { path = "std::time::SystemTime::now", reason = "sans-IO: take the time as a `now_ns` argument" },
  { path = "std::thread::spawn", reason = "sans-IO: no threads" },
  { path = "std::thread::sleep", reason = "sans-IO: never block" },
]
