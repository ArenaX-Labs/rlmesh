[package]
name = "rlmesh-gym"
description = "Internal RLMesh crate (unstable Rust API): the lockstep and virtual clock modes of a real-time session (protocol v2) and the Gymnasium compatibility path: v1 envs and model servers run unchanged on v2."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Not released until the v0.2 wire spec freezes.
publish = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
# The v1 adapter engine (resolver + `join` lowering), reused on the Gym
# compatibility path (§12.4) and re-exported as `rlmesh_gym::adapters`.
rlmesh-adapters = { workspace = true }
rlmesh-grpc = { workspace = true }
rlmesh-proto = { workspace = true }
rlmesh-record = { workspace = true }
rlmesh-runtime = { workspace = true }
rlmesh-session = { workspace = true }
rlmesh-spaces = { workspace = true }
rlmesh-wire = { workspace = true }
serde = { workspace = true }
# Exact float round trips: info and options cross the wire as JSON (§12.2).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zenoh = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
rlmesh = { workspace = true, features = ["lockstep"] }

[lints]
workspace = true
