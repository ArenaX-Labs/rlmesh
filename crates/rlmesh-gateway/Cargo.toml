[package]
name = "rlmesh-gateway"
description = "Internal RLMesh crate (unstable Rust API): the browser gateway of a real-time session (protocol v2): one WebSocket per traffic class, each browser a session participant."
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
# Not released until the v0.2 wire spec freezes.
publish = false

[[bin]]
name = "rlmesh-gateway"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws"] }
# Identity bindings' fingerprints.
blake3 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
rand = { workspace = true }
rlmesh-session = { workspace = true }
rlmesh-wire = { workspace = true }
# TLS: the ring provider only (no aws-lc), as everywhere in the workspace.
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { workspace = true }
tower-http = { workspace = true, features = ["fs", "set-header"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# Per-publisher reliability needs `unstable` (as in rlmesh-session).
zenoh = { workspace = true, features = ["unstable"] }

[dev-dependencies]
# Handshake tests: a throwaway certificate.
rcgen = { workspace = true }
# The bridge tests' robot.
rlmesh-edge = { workspace = true }
# The browser binding's frame tags, checked against this crate's.
rlmesh-wasm = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
