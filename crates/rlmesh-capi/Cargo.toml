[package]
name = "rlmesh-capi"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false
description = "Experimental C ABI for RLMesh — a thin extern \"C\" projection of the core model/env runtime."

[lib]
name = "rlmesh_capi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rlmesh = { workspace = true }
rlmesh-grpc = { workspace = true }
rlmesh-spaces = { workspace = true }
rlmesh-adapters = { workspace = true }
async-trait = { workspace = true }
image = { workspace = true, features = ["png"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
