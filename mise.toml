# ──────────────────────────────────────────────
# Tools
# ──────────────────────────────────────────────
[tools]
rust = { version = "1.99", components = "rustfmt,clippy" }

# Python: 3.11 is the dev interpreter (abi3 floor); 3.10 is added for release
# wheels by `setup:python:release`.
python = "3.11"
uv = "0.12"
maturin = "1.15"

# Cross-compiles release wheels (maturin --zig) and builds the C/C++ binding smokes.
zig = "0.17"
# Cross-compiles the Windows (MSVC) C/C++ package from Linux; needs clang on PATH.
"github:rust-cross/cargo-xwin" = "0.23"

# Markdown/TOML/YAML/JSON formatting. node only exists to run oxfmt (npm backend).
node = "24"
oxfmt = "0.71"

# Rust lint and dependency checks
typos = "1.50"
cargo-deny = "0.20"
"github:bnjbvr/cargo-machete" = "0.9"

# Protobuf. protoc is required by crates/rlmesh-proto/build.rs.
protoc = "36"
buf = "1.73"

# C/C++ bindings (rlmesh-capi): clang-format formats, cmake drives the packaging smoke.
clang-format = "23"
cmake = "4.4"

# Hooks
prek = "0.5"

# Publish tokens (CARGO_REGISTRY_TOKEN, PYPI_TOKEN) from the keychain via fnox.toml.
fnox = "1.36"

# `mise watch <task>` (e.g. `mise watch test:rust`) reruns a task on file change.
watchexec = "2.7"

# Build speed: sccache caches compiled crates (RUSTC_WRAPPER below), and nextest
# runs the Rust tests (process per test, per-test timeouts, filtersets).
sccache = "0.18"
"github:nextest-rs/nextest" = { version = "0.9", version_prefix = "cargo-nextest-" }

[settings]
python.uv_venv_auto = "create|source"
task.run_auto_install = false

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
# One uv cache per user, shared by every worktree: uv hardlinks from it, so a
# fresh worktree's sync is near-instant and settling a worktree keeps it.
UV_CACHE_DIR = "{{ env.XDG_CACHE_HOME | default(value=env.HOME ~ '/.cache') }}/uv"
CARGO_HTTP_MULTIPLEXING = "false"
# Every rustc call (cargo, clippy, maturin) goes through sccache. Locally it
# caches on disk, shared by all worktrees; Depot runners preset
# SCCACHE_WEBDAV_* so CI caches in Depot Cache. RLMESH_SCCACHE=0 turns it off:
# release.yml sets it so published artifacts never come from a shared cache.
RUSTC_WRAPPER = "{% if env.RLMESH_SCCACHE | default(value='1') != '0' %}sccache{% endif %}"
# With RLMESH_BUILDER=depot (set per machine), point sccache at Depot Cache
# using the `depot login` credentials, so local builds share CI's cache.
_.source = "scripts/dev/depot-cache-env.sh"

# ──────────────────────────────────────────────
# Setup
# ──────────────────────────────────────────────
[tasks."setup"]
description = "Install tools, Python dev dependencies, and git hooks"
depends = ["setup:python", "setup:hooks"]

[tasks."setup:python"]
description = "Sync Python dev environment"
run = "uv sync --group dev"

[tasks."setup:python:release"]
description = "Install additional Python interpreters used for release wheel builds"
run = "mise install python@3.10"

[tasks."setup:hooks"]
description = "Install git hooks"
run = "prek install --hook-type pre-commit --hook-type post-merge --hook-type post-checkout"

[tasks."setup:rust:targets"]
description = "Install Rust targets used for release wheel builds"
run = "rustup target add aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc"

# ──────────────────────────────────────────────
# Format (mutating)
# ──────────────────────────────────────────────
[tasks."fmt"]
description = "Format all source files"
depends = ["fmt:rust", "fmt:python", "fmt:proto", "fmt:config", "fmt:cxx"]

[tasks."fmt:rust"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."fmt:python"]
description = "Format Python code"
run = "uv run ruff format"

[tasks."fmt:proto"]
description = "Format Protobuf definitions"
run = "buf format -w"

[tasks."fmt:config"]
description = "Format Markdown, TOML, YAML, and JSON files with oxfmt"
run = "git ls-files -z --cached --others --exclude-standard -- '*.md' '*.toml' '*.yml' '*.yaml' '*.json' '*.jsonc' | xargs -0 oxfmt --write"

# ──────────────────────────────────────────────
# Format checks (non-mutating)
# ──────────────────────────────────────────────
[tasks."fmt:check"]
description = "Check formatting without modifying files"
depends = [
  "fmt:check:rust",
  "fmt:check:python",
  "fmt:check:proto",
  "fmt:check:config",
  "fmt:check:cxx",
]

[tasks."fmt:check:rust"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."fmt:check:python"]
description = "Check Python formatting"
run = "uv run ruff format --check"

[tasks."fmt:cxx"]
description = "Format the C/C++ bindings and examples (clang-format)"
run = "clang-format -i crates/rlmesh-capi/include/*.h* crates/rlmesh-capi/examples/*.c crates/rlmesh-capi/examples/*.cpp tests/parity/*.c tests/parity/*.cpp examples/chrono/src/* integrations/unreal/RLMesh/Source/RLMeshUnreal/*/*.h integrations/unreal/RLMesh/Source/RLMeshUnreal/*/*.cpp integrations/unreal/RLMesh/Tests/*.cpp integrations/unity/Tests~/step_client.cpp csharp/tests/init.c csharp/tests/Benchmark/runner.cpp"

[tasks."fmt:check:cxx"]
description = "Check the C/C++ binding and example formatting"
run = "clang-format --dry-run --Werror crates/rlmesh-capi/include/*.h* crates/rlmesh-capi/examples/*.c crates/rlmesh-capi/examples/*.cpp tests/parity/*.c tests/parity/*.cpp examples/chrono/src/* integrations/unreal/RLMesh/Source/RLMeshUnreal/*/*.h integrations/unreal/RLMesh/Source/RLMeshUnreal/*/*.cpp integrations/unreal/RLMesh/Tests/*.cpp integrations/unity/Tests~/step_client.cpp csharp/tests/init.c csharp/tests/Benchmark/runner.cpp"

[tasks."fmt:check:proto"]
description = "Check Protobuf formatting"
run = "buf format -d --exit-code"

[tasks."fmt:check:config"]
description = "Check Markdown, TOML, YAML, and JSON formatting with oxfmt"
run = "git ls-files -z --cached --others --exclude-standard -- '*.md' '*.toml' '*.yml' '*.yaml' '*.json' '*.jsonc' | xargs -0 oxfmt --check"

# ──────────────────────────────────────────────
# Fix (mutating)
# ──────────────────────────────────────────────
[tasks."fix"]
description = "Apply safe auto-fixes and format all source files"
depends = ["fix:rust", "fix:python", "fmt"]

[tasks."fix:rust"]
description = "Apply safe Rust fixes"
env = { CARGO_TARGET_DIR = "target/clippy", CARGO_INCREMENTAL = "0" }
run = "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged --allow-no-vcs -- -D warnings"

[tasks."fix:python"]
description = "Apply safe Python lint fixes"
run = "uv run ruff check --fix"

# ──────────────────────────────────────────────
# Lint (non-mutating)
# ──────────────────────────────────────────────
[tasks."lint"]
description = "Lint source files without modifying them"
depends = ["lint:rust", "lint:python", "lint:proto", "lint:spelling", "lint:deps"]

[tasks."lint:rust"]
description = "Lint Rust code"
env = { CARGO_TARGET_DIR = "target/clippy", CARGO_INCREMENTAL = "0" }
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:python"]
description = "Lint Python code"
run = "uv run ruff check"

[tasks."lint:proto"]
description = "Lint Protobuf definitions"
run = "buf lint"

[tasks."lint:spelling"]
description = "Check spelling in source files"
run = "typos"

[tasks."lint:deps"]
description = "Check Rust dependency licenses, bans, sources, and unused dependencies"
# Deterministic checks only. lint:deps:audit (RustSec advisories) is invocable
# on demand and runs in nightly CI, but stays out of the check gate so a new
# advisory can't red main/PRs with zero code change.
run = ["mise run lint:deps:deny", "mise run lint:deps:unused"]

[tasks."lint:deps:audit"]
description = "Check Rust dependency advisories (RustSec; not in the check gate)"
run = "cargo deny check advisories"

[tasks."lint:deps:deny"]
description = "Check Rust dependency licenses, bans, and sources"
run = "cargo deny check licenses bans sources"

[tasks."lint:deps:duplicates"]
description = "Report duplicate Rust dependency versions without failing"
run = "cargo tree -d --workspace"

[tasks."lint:deps:unused"]
description = "Check for unused Rust dependencies"
run = "cargo machete --with-metadata"

[tasks."deps:outdated"]
description = "Report outdated mise tools, Rust crates, and Python dependencies without changing anything"
run = [
  "echo '==> mise tools'; mise outdated --bump",
  "echo '==> Rust crates (Cargo.lock)'; cargo update --dry-run",
  "echo '==> Python direct dependencies'; uv tree --outdated --depth 1 --all-groups | grep 'latest:' || echo 'all up to date'",
]

# ──────────────────────────────────────────────
# Typecheck (non-mutating)
# ──────────────────────────────────────────────
[tasks."typecheck"]
description = "Typecheck all supported language bindings"
depends = ["typecheck:python"]

[tasks."typecheck:python"]
description = "Typecheck Python code"
run = "uv run basedpyright"

# ──────────────────────────────────────────────
# Docs (non-mutating)
# ──────────────────────────────────────────────
[tasks."docs:rust:check"]
description = "Build Rust library docs with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --lib"

# ──────────────────────────────────────────────
# Native Python stubs
# ──────────────────────────────────────────────
# The stub_gen bin declares `stub-gen` via required-features, so this task must
# pass it explicitly.
[tasks."stubs:generate"]
description = "Generate native Python stubs"
run = "cargo run --manifest-path python/rlmesh/rust/Cargo.toml --features stub-gen --bin stub_gen"

[tasks."stubs:check"]
description = "Check generated native Python stubs without modifying files"
run = "cargo run --manifest-path python/rlmesh/rust/Cargo.toml --features stub-gen --bin stub_gen -- --check"

# ──────────────────────────────────────────────
# Compatibility policy (non-mutating)
# ──────────────────────────────────────────────
[tasks."policy:check"]
description = "Check rlmesh.toml, artifact versions, and compatibility constants"
run = [
  "python scripts/check_rlmesh_policy.py --selfcheck",
  "python scripts/check_rlmesh_policy.py",
  "python scripts/release.py --check",
]

[tasks."protocol:baseline-regen"]
description = "Re-snapshot the frozen proto baseline for the current protocol generation"
run = "python scripts/protocol_baseline.py regen"

[tasks."protocol:baseline-verify"]
description = "Verify live protos are byte-identical to the frozen generation baseline"
run = "python scripts/protocol_baseline.py verify"

[tasks."protocol:breaking"]
description = "Check live protos for wire-breaking changes against the immutable release tag"
run = "python scripts/protocol_baseline.py breaking"

# ──────────────────────────────────────────────
# Check (non-mutating)
# ──────────────────────────────────────────────
[tasks."check"]
description = "Run non-mutating verification checks"
depends = [
  "fmt:check",
  "lint",
  "typecheck",
  "docs:rust:check",
  "stubs:check",
  "policy:check",
  "protocol:baseline-verify",
  "protocol:breaking",
  "parity:check",
]

# ──────────────────────────────────────────────
# Test
# ──────────────────────────────────────────────
[tasks."test"]
description = "Run Rust tests, Python unit/integration tests, and the C/C++ binding smoke + e2e"
depends = ["test:rust", "test:python", "test:cxx"]

# The single test entrypoint CI runs after `check`; run it locally for CI parity.
[tasks."test:ci"]
depends = ["parity:fixtures"]
description = "Everything CI tests: test + API surface + examples + system harness + installed-wheel system profile against a freshly built local wheel"
run = [
  "mise run test",
  "mise run test:python:api-surface",
  "mise run test:python:examples",
  "mise run test:system:harness",
  "mise run build:python:local",
  "mise run test:system",
]

# Sibling of the test:cxx file task; test/cxx is itself a file, so this is a referenced script.
[tasks."test:cxx:pkg"]
description = "Build the C/C++ package, then build the C++ smoke against the INSTALLED package (pkg-config + find_package) and run it end-to-end vs a live env"
dir = "{{ config_root }}"
file = "scripts/test-cxx-pkg.sh"

# The extension's tests embed Python, which does not discover the venv on its
# own on every platform (macOS), so its site-packages is put on PYTHONPATH.
[tasks."test:rust"]
description = "Run Rust workspace tests and doctests"
run = '''
export PYTHONPATH="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" &&
  cargo nextest run --workspace --all-targets -E 'not (binary(parity_fixtures) | binary(parity_defaults))' &&
  cargo test --workspace --doc
'''

# The fast local loop: Rust tests for changed crates and their dependents,
# plus Python tests when they can be affected. Not a gate; see the script.
[tasks."test:affected"]
description = "Run tests for crates changed since origin/main (and their dependents); pass --base REF or --dry-run"
run = 'mise run dev:heavy -- python scripts/dev/affected.py {{arg(name="args", var=true, required=false)}}'

[tasks."test:python"]
description = "Run Python unit, integration, and conformance tests plus the authoring-import guard"
run = "uv run pytest python/rlmesh/tests/unit python/rlmesh/tests/integration python/rlmesh/tests/conformance python/rlmesh/tests/test_no_authoring_import.py -q"

[tasks."test:python:unit"]
description = "Run Python unit tests"
run = "uv run pytest python/rlmesh/tests/unit -q"

[tasks."test:python:integration"]
description = "Run Python integration tests"
run = "uv run pytest python/rlmesh/tests/integration -q"

[tasks."test:python:conformance"]
description = "Run Python adapter-spec conformance vectors (cross-engine parity gate)"
run = "uv run pytest python/rlmesh/tests/conformance -q"

[tasks."test:python:api-surface"]
description = "Run Python API surface tests"
run = "uv run pytest python/rlmesh/tests/api_surface -q"

[tasks."test:python:examples"]
description = "Run the headless example programs end to end"
run = "uv run pytest python/rlmesh/tests/examples -q"

# ──────────────────────────────────────────────
# Browser binding: javascript/rlmesh and its wasm core, javascript/rlmesh/wasm
# ──────────────────────────────────────────────
# Not in check, typecheck or test: those run in the `fast` CI job, which would
# then install the wasm toolchain and node_modules on every PR. The `browser`
# CI job runs these gates when their inputs change; `mise run test:js` is the
# local one-shot. File tasks: setup:js, build:js, check:sans-io, test:js:wasm,
# test:js:e2e.
[tasks."test:js"]
description = "Build the wasm and the JS package, then run every browser gate: wasm tests under Node, the .wasm import/size check, strict tsc, JS unit tests"
depends = ["build:js"]
run = [
  "mise run test:js:wasm",
  "mise run check:js:wasm",
  "mise run typecheck:js",
  "mise run test:js:unit",
]

# The real v2 codec (authority snapshots with parts, bindings, contracts and
# demands) measures ~96 KiB gzip; the budget keeps headroom and catches a
# dependency that drags in a runtime.
[tasks."check:js:wasm"]
description = "Check the built .wasm imports only wasm-bindgen glue (no env/WASI) and stays under 112 KiB gzip"
run = "node scripts/check-wasm.mjs javascript/rlmesh/pkg/rlmesh_bg.wasm --max-gzip 114688"

[tasks."typecheck:js"]
description = "Typecheck javascript/rlmesh (and the browser example) with strict tsc --noEmit"
depends = ["setup:js"]
dir = "{{ config_root }}/javascript/rlmesh"
run = "npx tsc --noEmit -p ."

[tasks."test:js:unit"]
description = "Run javascript/rlmesh's unit tests under Node (fake Workers and sockets)"
depends = ["setup:js"]
dir = "{{ config_root }}/javascript/rlmesh"
run = "node test/run.mjs"

# Node and Electron binding: javascript/rlmesh/native (napi-rs), wrapped by
# javascript/rlmesh/src/native.ts. Needs no wasm toolchain.
[tasks."build:js:native"]
description = "Build the Node/Electron native addon (javascript/rlmesh/native, profile node) into javascript/rlmesh/dist/rlmesh.{platform}-{arch}.node"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --profile node -p rlmesh-node
target_dir="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
for lib in "$target_dir"/node/{librlmesh_node.so,librlmesh_node.dylib,rlmesh_node.dll}; do
  [ -f "$lib" ] && break
done
out="javascript/rlmesh/dist/rlmesh.$(node -p 'process.platform + "-" + process.arch').node"
mkdir -p javascript/rlmesh/dist
cp "$lib" "$out"
echo "$out $(wc -c <"$out" | tr -d ' ') bytes"
'''

[tasks."test:js:native"]
description = "Run javascript/rlmesh's native tests: a Node host, robots and policies in one session over the addon (the twin of test_v2_session.py)"
depends = ["setup:js"]
run = [
  "mise run build:js:native",
  "cd javascript/rlmesh && node build.mjs --node-only",
  "node javascript/rlmesh/test/run.mjs --native",
  "node examples/node/hold.mjs > /dev/null",
]

[tasks."bench:js:native"]
description = "Benchmark the Node binding against Python's rlmesh.v2: a 1 kHz robot loop and a 50 Hz policy with a camera, in one process each (BENCH_SECONDS, default 10)"
depends = ["setup:js"]
run = [
  "mise run build:js:native",
  "cd javascript/rlmesh && node build.mjs --node-only",
  "node javascript/rlmesh/bench/session.mjs",
  "uv run python javascript/rlmesh/bench/session.py",
]

[tasks."demo:web"]
description = "Run the browser example: the example robot and the gateway, serving examples/web on http://127.0.0.1:18080/"
run = ["mise run build:js --demo", "bash examples/web/run.sh"]

[tasks."test:system:harness"]
description = "Run system test runner and fixture tests"
run = "uv run pytest tools/rlmesh_system/tests tools/rlmesh_system_fixtures/tests -q"

[tasks."test:system:list"]
description = "List installed-artifact system profiles and scenarios"
run = "uv run rlmesh-system list"

[tasks."test:system"]
description = "Run basic installed-artifact system scenarios against python/rlmesh/dist"
run = "uv run rlmesh-system run"

[tasks."test:system:heavy"]
description = "Run heavy installed-artifact system scenarios against python/rlmesh/dist"
run = "uv run rlmesh-system run --profile heavy"

[tasks."perf:baseline"]
description = "Capture the local tensor-conversion performance baseline (perf profile)"
run = [
  "uv run rlmesh-system run --profile perf --kind artifact",
  "bash -c 'cp \"$(ls -t target/python-validation/reports/validation-*.json | head -1)\" target/python-validation/perf-baseline.json && echo baseline=target/python-validation/perf-baseline.json'",
]

[tasks."perf:check"]
description = "Re-run the perf profile and fail on drift against the local baseline"
run = "uv run rlmesh-system run --profile perf --kind artifact --baseline target/python-validation/perf-baseline.json --fail-on-regression"

[tasks."test:crossver"]
# Standalone entrypoint builds its own release wheels. CI and release:check
# reuse the wheels they already built via test:crossver:installed.
description = "Run the cross-version matrix: this tree's release wheel against the pinned published one"
# Use the manifest's release edition rather than a local dev cohort. The
# matrix checks the expected refusal when the fixture is still provisional.
env = { RLMESH_RELEASE_BUILD = "1" }
run = ["mise run build:python:local", "mise run test:crossver:installed"]

[tasks."test:crossver:installed"]
description = "Run cross-version compatibility against existing release-cohort wheels"
run = [
  "uv run rlmesh-system run --profile compatibility",
  "cat target/python-validation/crossver/matrix.txt",
]

[tasks."test:system:clean"]
description = "Remove installed-artifact system venvs, logs, and reports"
run = "uv run rlmesh-system clean"

# The cockpit (protocol v2): one live session's channels, rates, timeline and
# arm/e-stop. ADDRESS is what `rlmesh.v2.Host.address` prints.
[tasks."cockpit"]
description = "Open the cockpit on a running v2 session: mise run cockpit -- ADDRESS"
run = 'cargo run --release -p rlmesh-cockpit -- {{arg(name="args", var=true)}}'

# ──────────────────────────────────────────────
# Build
# ──────────────────────────────────────────────
[tasks."build"]
description = "Build local Rust workspace and current-platform Python wheels"
run = ["mise run build:rust", "mise run build:python"]

[tasks."build:rust"]
description = "Build Rust workspace"
run = "cargo build --workspace"

[tasks."build:python"]
description = "Build current-platform Python wheels"
run = ["mise run stubs:generate", "mise run build:python:local"]

[tasks."build:python:local"]
description = "Build current-platform Python wheels"
run = [
  "mise run setup:python:release",
  "mise run build:python:wheel local",
  "python scripts/check_python_wheels.py python/rlmesh/dist --allow-local-platform-tags",
]

# ──────────────────────────────────────────────
# Release wheels
# ──────────────────────────────────────────────
# Full release matrix contains 14 wheels total, built by CI on tag push
# (.github/workflows/release.yml): macOS wheels on a macOS runner, Linux/Windows
# on a Linux runner.
#   Python:  cp310-cp310 and cp311-abi3 for each platform
#   macOS:   arm64, x86_64
#   Linux:   glibc (x86_64, aarch64), musl (x86_64, aarch64)
#   Windows: x86_64

[tasks."release:python:wheels"]
description = "Build release Python wheels supported by the current host"
env = { RLMESH_RELEASE_BUILD = "1" }
run = "case \"$(uname -s)\" in Darwin) mise run release:python:wheels:macos ;; Linux) mise run release:python:wheels:linux ;; *) echo 'unsupported release wheel host; use macOS for macOS wheels or Linux for Linux/Windows wheels' >&2; exit 1 ;; esac"

[tasks."release:python:clean"]
description = "Remove previously built Python wheels before a release wheel build"
run = "rm -f python/rlmesh/dist/rlmesh-*.whl"

[tasks."release:python:wheels:macos"]
description = "On macOS, prepare and build the macOS arm64/x86_64 wheels"
env = { RLMESH_RELEASE_BUILD = "1" }
run = [
  "test \"$(uname -s)\" = Darwin || { echo 'macOS wheels require a macOS host with Xcode Command Line Tools (xcrun)' >&2; exit 1; }",
  "mise run release:python:prepare",
  "status=0; mise run release:python:build:macos-all || status=1; mise run release:python:check:macos || status=1; exit $status",
]

[tasks."release:python:wheels:linux"]
description = "On Linux, prepare and build the Linux/Windows cross-build wheel matrix"
env = { RLMESH_RELEASE_BUILD = "1" }
run = [
  "test \"$(uname -s)\" = Linux || { echo 'Linux and Windows release wheels should be built from a Linux host' >&2; exit 1; }",
  "mise run release:python:prepare",
  "status=0; for task in release:python:build:linux-all release:python:build:windows-all; do mise run \"$task\" || status=1; done; mise run release:python:check:linux-windows || status=1; exit $status",
]

[tasks."release:python:prepare"]
description = "Clean dist, install release Python/Rust targets, and generate stubs"
run = [
  "mise run release:python:clean",
  "mise run setup:python:release",
  "mise run setup:rust:targets",
  "mise run stubs:generate",
]

[tasks."release:python:build:macos-all"]
description = "Build macOS arm64 then x86_64 wheels on a Darwin host"
run = "status=0; for target in macos-arm macos-x86; do mise run build:python:wheel \"$target\" || status=1; done; exit $status"

[tasks."release:python:build:linux-all"]
description = "Build Zig-backed Linux glibc/musl x86_64 and aarch64 wheels"
run = "status=0; for target in linux-x86 linux-arm linux-musl-x86 linux-musl-arm; do mise run build:python:wheel \"$target\" || status=1; done; exit $status"

[tasks."release:python:build:windows-all"]
description = "Build Zig-backed Windows x86_64 wheels"
run = "mise run build:python:wheel windows"

[tasks."release:python:check:linux-windows"]
description = "Strictly validate the Linux/Windows release wheel matrix"
run = "python scripts/check_python_wheels.py python/rlmesh/dist --platform-set linux-windows"

[tasks."release:python:check:macos"]
description = "Strictly validate the macOS release wheel matrix"
run = "python scripts/check_python_wheels.py python/rlmesh/dist --platform-set macos"

[tasks."release:rust:package"]
description = "Verify Rust crate packages without publishing"
env = { RLMESH_RELEASE_BUILD = "1" }
# The v2 crates are unpublished (publish = false) and depend on each other, so
# cargo cannot resolve them from crates.io when packaging; skip them, and
# rlmesh-python (a maturin wheel that now depends on them), until v0.2
# publishes them. rlmesh too, for now: its `lockstep` feature depends on
# rlmesh-gym, which is unpublished, so it cannot be packaged until that
# changes (a v0.2 release blocker), and rlmesh-capi, which would then mix
# the published rlmesh with this tree's crates.
run = 'rm -rf target/package-cargo-home/registry/*/-*; CARGO_HOME="$PWD/target/package-cargo-home" cargo package --workspace --allow-dirty --exclude rlmesh-wire --exclude rlmesh-session-core --exclude rlmesh-session --exclude rlmesh-edge --exclude rlmesh-wasm --exclude rlmesh-gateway --exclude rlmesh-node --exclude rlmesh-record --exclude rlmesh-gym --exclude rlmesh-cockpit --exclude rlmesh-python --exclude rlmesh --exclude rlmesh-capi'

[tasks."release:artifacts:licenses"]
description = "Validate release artifact license files before publishing"
run = "python scripts/check_release_artifact_licenses.py"

[tasks."release:check"]
description = "Run the local release gate without publishing"
env = { RLMESH_RELEASE_BUILD = "1" }
run = [
  "mise run check",
  "mise run test:ci",
  "mise run release:rust:package",
  "mise run release:artifacts:licenses",
  "mise run test:system:heavy",
  "mise run test:python:floors",
  "mise run test:crossver:installed",
]

# ──────────────────────────────────────────────
# Versioning + release driver
# ──────────────────────────────────────────────
[tasks.bump]
description = "Bump the version across every manifest (X.Y.Z or X.Y.Z-beta.N)"
run = 'python scripts/bump_version.py {{arg(name="version")}}'

[tasks."changelog:draft"]
description = "Append draft Unreleased changelog bullets from commits since the last release tag"
run = "python scripts/changelog_draft.py"

[tasks.release]
description = "Release driver: bump, gate, tag (pass args after --, e.g. -- 0.2.0 --dry-run)"
run = 'python scripts/release.py {{arg(name="version", var=true)}}'

# Per-target wheel builds live in the parametrized file task
# .mise/tasks/build/python/wheel (task: build:python:wheel <target>).

[tasks."parity:check"]
description = "Check the reviewed Stable Python to Rust/C/C++ parity manifest"
run = [
  "uv run pytest tools/rlmesh_api_surface/tests -q",
  "uv run python -m rlmesh_api_surface.parity",
]

[tasks."csharp:interop:generate"]
description = "Generate internal C# P/Invoke declarations from rlmesh.h"
run = "mise run dev:heavy -- python csharp/tools/run.py generate"

[tasks."csharp:interop:check"]
description = "Check the generated C# interop for staleness"
run = "mise run dev:heavy -- python csharp/tools/run.py interop-check"

[tasks."csharp:generate"]
description = "Generate C# interop (accepts --check)"
run = 'mise run dev:heavy -- python csharp/tools/run.py generate {{arg(name="args", var=true, required=false)}}'

[tasks."check:csharp"]
description = "Check generated interop and both C# assembly surfaces"
run = "mise run dev:heavy -- python csharp/tools/run.py check"

[tasks."csharp:check"]
description = "Alias for check:csharp"
depends = ["check:csharp"]

[tasks."test:csharp"]
description = "Check C# interop and run ABI, ownership and Python interoperability tests"
run = "mise run dev:heavy -- python csharp/tools/run.py test"

[tasks."csharp:pack"]
description = "Build NuGet and symbol packages from available release native assets"
usage = 'flag "--require-all" help="Require every released native RID"'
run = '''
if [ "${usage_require_all:-false}" = true ]; then set -- --require-all; else set --; fi
mise run dev:heavy -- python csharp/tools/run.py pack "$@"
'''

[tasks."csharp:upm"]
description = "Assemble the prebuilt Unity UPM package"
usage = 'flag "--require-all" help="Require every released native RID"'
run = '''
if [ "${usage_require_all:-false}" = true ]; then set -- --require-all; else set --; fi
mise run dev:heavy -- python csharp/tools/run.py upm "$@"
'''

[tasks."test:csharp:package"]
description = "Verify package structure and a fresh NuGet consumer driven by Python"
run = "mise run dev:heavy -- python csharp/tools/run.py package-test"

[tasks."test:csharp:aot"]
description = "Publish the serving harness with NativeAOT and drive it from Python"
run = "mise run dev:heavy -- python csharp/tools/run.py aot"

[tasks."bench:csharp"]
description = "Measure C# allocation gates and five interleaved advisory C++ timing batches"
run = "mise run dev:heavy -- python csharp/tools/run.py bench --timing"
